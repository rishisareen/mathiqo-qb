stem_i18n:
  en-IN: "{{name1}} is asked to draw a circle of radius {{r}} cm using a compass, but mixes up radius and diameter and sets the compass opening to what should have been the diameter instead. What length, in centimetres, did {{name1}} wrongly set the compass to?"
localization_slots:
  - name1

answer: "2 * r"

distractors: []

solution_steps_i18n:
  en-IN:
    canonical:
      - "The diameter is twice the radius."
      - "Wrongly setting the compass to the diameter means setting it to 2 x {{r}} cm."

