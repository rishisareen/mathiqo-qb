# Class 6 Servable Coverage plan, U6: GEO.CONSTRUCT.BASIC authoring batch.
# A figure built from a line segment and a circle (skill description:
# "figures ... built from circles and line segments"). n constrained even
# for an exact radius.
template_id: TPL.GEO.CONSTRUCTBASIC.CIRCLE.FROMSEGMENT.001
skill_ids:
