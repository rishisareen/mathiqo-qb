question_type: mcq_4
cognitive_level: procedural
difficulty_prior: easy
estimated_time_sec: 30
calculator_allowed: false
diagram_required: true
context_tags:
  - school

variables:
  n: { type: int, range: [4, 30] }
constraints:
  - "n % 2 == 0"
  - "n != 4"

stem_i18n:
  en-IN: "A construction combines a line segment {{n}} cm long with a circle whose radius is exactly half that segment, so the segment becomes the circle's diameter. If the segment is {{n}} cm and everything is constructed correctly, what is the circle's radius, in centimetres?"
localization_slots: []

answer: "n / 2"

distractors:
  - expr: "n"
    misconception_id: null
  - expr: "2 * n"
    misconception_id: null
  - expr: "n / 2 + 2"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "The segment is the circle's diameter, and the radius is half the diameter."
      - "Radius = {{n}} / 2 cm."

hints_i18n:
  en-IN:
    - "The whole segment is the diameter — the radius is only half of that."
    - "Divide the segment length by 2."

