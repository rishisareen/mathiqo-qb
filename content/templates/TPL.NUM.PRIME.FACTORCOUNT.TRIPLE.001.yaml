# NUM.PRIME — three-distinct-primes variant of the factor-count proxy
# (TPL.NUM.PRIME.FACTORCOUNT.001's sibling): p, q, r curated to
# {2,3,5,7} and pairwise distinct. A product of three different primes
# always has exactly 8 factors (every subset of {p,q,r} multiplies to a
# distinct factor: 2^3 = 8 subsets), a fact the author guarantees by the
# curated domain, not tested at runtime.
