  en-IN:
    canonical:
      - "{{p}}, {{q}} and {{r}} are all prime, so each only divides the product on its own or in a group."
      - "Every choice of including or leaving out each prime gives a different factor."
      - "That gives 2 x 2 x 2 = 8 factors in total."

