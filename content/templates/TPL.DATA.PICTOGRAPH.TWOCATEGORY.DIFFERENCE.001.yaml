# Class 6 servable coverage, Implementation Unit U7: DATA.PICTOGRAPH batch.
# Two-category pictograph comparison, labeled text table (diagram_required:
# true). n1/n2 ranges are disjoint (Zoo 4-8, Museum 1-3) so Zoo always has
# more votes regardless of the draw — zero constraint rejection. Medium
# band, numeric_entry.
template_id: TPL.DATA.PICTOGRAPH.TWOCATEGORY.DIFFERENCE.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - DATA.PICTOGRAPH
question_type: numeric_entry
cognitive_level: application
difficulty: 0.5
difficulty_prior: medium
estimated_time_sec: 50
calculator_allowed: false
diagram_required: true
context_tags:
  - school

variables:
  n1: { type: int, range: [4, 8] }
  n2: { type: int, range: [1, 3] }
  k: { type: int, range: [2, 5] }

constraints: []

localization_slots: []
stem_i18n:
  en-IN: "A pictograph compares votes for the class trip: 'Zoo' has {{n1}} symbols and 'Museum' has {{n2}} symbols, with key 1 symbol = {{k}} votes. How many more votes did 'Zoo' receive than 'Museum'?"

answer: "(n1 - n2) * k"

distractors:
  - expr: "n1 - n2"
    misconception_id: MISC.DATA.SCALE-IGNORED

solution_steps_i18n:
  en-IN:
    canonical:
      - "Zoo's total is {{n1}} x {{k}}, and Museum's total is {{n2}} x {{k}}."
      - "Subtract Museum's total from Zoo's total to find how many more votes Zoo received."

hints_i18n:
  en-IN:
    - "Convert both symbol counts to actual votes using the key before comparing."
    - "Find each category's total first, then subtract."

figure:
  - kind: pictograph
    key_expr: "k"
    unit: "votes"
    rows:
      - label_i18n:
          en-IN: "Zoo"
        whole_expr: "n1"
      - label_i18n:
          en-IN: "Museum"
        whole_expr: "n2"

tts: false
exam_contexts:
  - SCHOOL_EXAM
