# Stage 2 authored 2026-07-29 (Class 6 servable coverage, Implementation Unit
# U4). Constant-difference (arithmetic) "what comes next" drill, direct
# numeric pattern, easy band. Three shown terms t1,t2,t3 are independent
# declared variables tied by one equality constraint ("t3-t2 == t2-t1")
# rather than derived from a hidden start/step pair, because stem_i18n only
# substitutes bare declared variables — it cannot render a computed
# expression like start+step. Constant-difference IS the correct rule here
# (this item does not target MISC.NUM.PATTERN-CONSTANT-DIFF — see
# TPL.NUM.PATTERN.GROW.NEXT.001 for that).
template_id: TPL.NUM.PATTERN.ARITH.NEXT.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - NUM.PATTERN.EXTEND
question_type: numeric_entry
cognitive_level: procedural
difficulty: 0.2
difficulty_prior: easy
estimated_time_sec: 30
calculator_allowed: false
diagram_required: false
context_tags:
  - games
exam_contexts:
  - SCHOOL_EXAM

variables:
  t1: { type: int, range: [1, 10] }
  t2: { type: int, range: [3, 20] }
  t3: { type: int, range: [5, 30] }

constraints:
  - "t3 - t2 == t2 - t1"
  - "t2 > t1"

localization_slots: []
stem_i18n:
  en-IN: "Look at this number pattern: {{t1}}, {{t2}}, {{t3}}, .... What is the next number?"

answer: "2 * t3 - t2"

distractors: []

solution_steps_i18n:
  en-IN:
    canonical:
      - "Find the difference between {{t2}} and {{t1}}, and between {{t3}} and {{t2}}."
      - "Since that difference stays the same, add it to {{t3}} to get the next number."

hints_i18n:
  en-IN:
    - "What number is being added each time to get from one term to the next?"
    - "Add that same amount to the last number, {{t3}}."

