stem_i18n:
  en-IN: A number is written as {{p}} x {{q}} x {{r}}, where {{p}}, {{q}} and {{r}} are three different prime numbers. How many prime factors does the number have, counted with repetition?
answer: '3'
distractors:
- expr: '2'
  misconception_id: MISC.NUM.COMPOSITE-FACTORS-LEFT
solution_steps_i18n:
  en-IN:
    canonical:
    - Check each of the three factors {{p}}, {{q}} and {{r}} — none of them can be broken down further since all three are prime.
    - Every factor in the product is prime, so the number has 3 prime factors.
hints_i18n:
  en-IN:
  - Do not stop early by grouping two of the primes together as if they were still one factor — count all three separately.
