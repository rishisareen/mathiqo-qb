  - SCHOOL_EXAM

variables:
  n: { type: int, range: [6, 60] }
  k: { type: int, range: [2, 9] }

constraints:
  - "gcd(n, k) == k"
  - "n > k"

localization_slots: []
stem_i18n:
  en-IN: "{{k}} is a factor of {{n}}. What is {{n}} divided by {{k}}?"

answer: "n / k"

distractors: []

solution_steps_i18n:
  en-IN:
    canonical:
      - "Since {{k}} is a factor of {{n}}, {{n}} divides by {{k}} exactly."
      - "{{n}} divided by {{k}} gives a whole number with no remainder."

hints_i18n:
  en-IN:
    - "Divide {{n}} by {{k}} — it should come out exactly, with nothing left over."

