# Authored 2026-07-29 (Class 6 servable coverage, Implementation Unit U5).
# NUM.FACTORS.MULTIPLES — the sibling factor-quotient item to
# TPL.NUM.LCM.DIRECT.001's family: gcd(n,k) == k is the clean "k divides n
# exactly" constraint (per U5 lesson notes), so n / k is guaranteed to be a
# whole number for every surviving variant.
template_id: TPL.NUM.FACTORS.DIVBYFACTOR.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
