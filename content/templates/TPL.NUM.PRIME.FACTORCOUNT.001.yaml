# Authored 2026-07-29 (Class 6 servable coverage, Implementation Unit U5).
# NUM.PRIME, Ch. 5 "Prime Time". No primality-testing builtin exists (only
# + - * / %, comparisons, gcd/lcm/simplify), so this uses the numeric-proxy
# convention: p and q are curated (via range [2,7] with explicit p!=4,p!=6
# exclusions) to always be two DIFFERENT primes from {2,3,5,7} — a fact the
# author guarantees by construction, never tested at runtime. A product of
# two distinct primes always has exactly 4 factors (1, p, q, p*q), so the
# answer is the constant 4 for every surviving variant. High constraint-
# rejection is expected and tolerated (KTD5) — it's the direct cost of the
# curated-primes-only domain trick.
