    canonical:
      - "{{p}} and {{q}} are both prime, so their only factors are 1 and themselves."
      - "The factors of {{p}} x {{q}} are exactly 1, {{p}}, {{q}}, and {{p}} x {{q}}."
      - "That is 4 factors in total."

