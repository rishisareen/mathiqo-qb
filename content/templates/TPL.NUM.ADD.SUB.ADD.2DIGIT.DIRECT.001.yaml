# Class 6 servable coverage plan, U4. NUM.ADD.SUB: direct 2-digit addition
# with regrouping. Variables are the individual digits (a1 tens, a0 ones,
# b1 tens, b0 ones) of the two addends so the stem can render the actual
# two-digit numbers via adjacent {{a1}}{{a0}} slot substitution, and so the
# ADD-NO-CARRY distractor can reproduce the signature bug exactly:
# 47 + 38 -> tens 4+3=7, ones 7+8=15, written together as 715, i.e.
# 100*(a1+b1) + (a0+b0). Guarded to fire only when a carry is actually
# needed (a0+b0 >= 10), matching the misconception's real applicability.
template_id: TPL.NUM.ADD.SUB.ADD.2DIGIT.DIRECT.001
skill_ids:
  - NUM.ADD.SUB
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: easy
estimated_time_sec: 30
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a1: { type: int, range: [2, 9] }
  a0: { type: int, range: [1, 9] }
  b1: { type: int, range: [1, 8] }
  b0: { type: int, range: [1, 9] }

constraints: []

stem_i18n:
  en-IN: "What is {{a1}}{{a0}} + {{b1}}{{b0}}?"
localization_slots: []

answer: "10*a1 + a0 + 10*b1 + b0"

distractors:
  - expr: "100*(a1+b1) + (a0+b0)"
    misconception_id: MISC.NUM.ADD-NO-CARRY
    only_if: "a0 + b0 >= 10"
  - expr: "a1 + a0 + b1 + b0"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Add the ones digits first: {{a0}} + {{b0}}."
      - "If the ones sum is 10 or more, write the ones digit and carry 1 to the tens column."
      - "Add the tens digits, plus any carry: {{a1}} + {{b1}}."

hints_i18n:
  en-IN:
    - "Add the ones column first, then the tens column."
    - "If a column adds to 10 or more, carry the extra ten to the next column."

