    misconception_id: MISC.MEAS.PERIMETER-AREA-CONFUSED
  - expr: "r + c"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Each row has {{c}} unit squares, and there are {{r}} rows."
      - "Count the total unit squares by multiplying: {{r}} x {{c}}."

hints_i18n:
  en-IN:
    - "You could count every square one by one, or find a faster way using the rows and columns."
    - "Each of the {{r}} rows has the same number of squares, {{c}}. Multiply instead of counting one by one."

