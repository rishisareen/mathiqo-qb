# Class 6 servable coverage plan, U7. INT.CMP.ORDER: certifying the skill in
# the low-guess numeric_entry format (KTD6), asking for the smaller integer
# rather than the greater one. Disjoint ranges (a in [-5,-1], b in [-9,-6])
# guarantee a > b with zero rejection, distinct stem wording and question
# direction from TPL.INT.CMP.ORDER.NEGNEG.DIRECT.001. b is always the
# smaller (more negative, bigger-digit) value, so the "a" distractor
# reproduces MISC.INT.BIGGER-ABS: picking the smaller-digit number as
# "smaller" while ignoring the sign.
template_id: TPL.INT.CMP.ORDER.SMALLER.NUM.001
skill_ids:
  - INT.CMP.ORDER
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: medium
estimated_time_sec: 25
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [-5, -1] }
  b: { type: int, range: [-9, -6] }

constraints: []

stem_i18n:
  en-IN: "Between {{a}} and {{b}}, what is the smaller integer?"
localization_slots: []

answer: "b"

distractors:
  - expr: "a"
    misconception_id: MISC.INT.BIGGER-ABS

solution_steps_i18n:
  en-IN:
    canonical:
      - "{{b}} is further below zero than {{a}} on the number line."
      - "The number further below zero is the smaller one, so {{b}} is the smaller integer."

hints_i18n:
  en-IN:
    - "Which number sits further to the left on the number line?"
    - "Further below zero means smaller, no matter how the digits compare."

template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
difficulty: 0.5
tts: false
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
