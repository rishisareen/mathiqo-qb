stem_i18n:
  en-IN: Priya has {{n}} beads. If she divides them into groups of 5, how many beads are left over?
answer: n % 5
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
    - Check the last digit of {{n}}.
    - If it is 0 or 5, the beads split exactly into groups of 5 with no remainder; otherwise the remainder is the last digit's distance from the nearest smaller multiple of 5.
hints_i18n:
  en-IN:
  - A number is exactly divisible by 5 only if it ends in 0 or 5.
