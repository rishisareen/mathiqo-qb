# Class 6 servable coverage plan, U4. NUM.ADD.SUB: hard-band 3-digit
# addition with regrouping — the depth extension of
# TPL.NUM.ADD.SUB.ADD.2DIGIT.DIRECT.001 to a third digit. The
# ADD-NO-CARRY distractor is guarded to the ones-column carry case only
# (a0+b0 >= 10), same convention as the 2-digit template.
template_id: TPL.NUM.ADD.SUB.ADD.3DIGIT.001
skill_ids:
  - NUM.ADD.SUB
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: hard
estimated_time_sec: 50
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a2: { type: int, range: [3, 6] }
  a1: { type: int, range: [2, 5] }
  a0: { type: int, range: [3, 9] }
  b2: { type: int, range: [1, 4] }
  b1: { type: int, range: [1, 4] }
  b0: { type: int, range: [3, 9] }

constraints: []

stem_i18n:
  en-IN: "What is {{a2}}{{a1}}{{a0}} + {{b2}}{{b1}}{{b0}}?"
localization_slots: []

answer: "100*a2 + 10*a1 + a0 + 100*b2 + 10*b1 + b0"

distractors:
  - expr: "1000*(a2+b2) + 100*(a1+b1) + (a0+b0)"
    misconception_id: MISC.NUM.ADD-NO-CARRY
    only_if: "a0 + b0 >= 10"

solution_steps_i18n:
  en-IN:
    canonical:
      - "Add the ones column first: {{a0}} + {{b0}}."
      - "Carry to the tens column if the ones sum is 10 or more."
      - "Add the tens column, then the hundreds column, carrying as needed at each step."

hints_i18n:
  en-IN:
    - "Work column by column, right to left: ones, then tens, then hundreds."
    - "Carry the extra ten (or hundred) forward whenever a column adds to 10 or more."

