# Class 6 Servable Coverage plan, U6: GEO.ANGLE.CONCEPT depth batch.
# An angle is the figure formed by two rays from a common vertex — this
# numeric proxy counts the distinct angles formed by every pair among n
# rays sharing one vertex (n(n-1)/2, the same combinatorial shape as
# TPL.GEO.POINTLINE.SEGMENTS.COLLINEAR.001, reused here for a genuinely
# different figure: rays and angles at a shared vertex, not collinear
# points). n starts at 4 so the "n" distractor never numerically equals
# the answer (both equal 3 only at n = 3).
template_id: TPL.GEO.ANGLECONCEPT.SHARED.VERTEX.RAYS.001
skill_ids:
  - GEO.ANGLE.CONCEPT
question_type: mcq_4
cognitive_level: application
difficulty_prior: medium
estimated_time_sec: 40
calculator_allowed: false
diagram_required: true
context_tags:
  - school
  - objects

variables:
  n: { type: int, range: [4, 7] }
constraints: []

stem_i18n:
  en-IN: "{{n}} different rays are drawn from the same point O, like spokes from a hub, no two rays pointing the same way. Each pair of these rays forms one angle at O (the figure made by two rays sharing a common vertex). How many distinct angles are formed in total?"
localization_slots: []

answer: "n*(n-1)/2"

distractors:
  - expr: "n"
    misconception_id: null
  - expr: "n - 1"
    misconception_id: null
  - expr: "n*(n-1)"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Every pair of the {{n}} rays forms one angle at O, and the angle between ray 1 and ray 2 is the same angle as between ray 2 and ray 1."
      - "The number of pairs from {{n}} rays is n(n-1)/2 = {{n}}({{n}}-1)/2."

hints_i18n:
  en-IN:
    - "Try it with just 3 rays first — how many angles do they form at the shared vertex?"
    - "Each ray pairs with every other ray once to form an angle. That's n(n-1) ordered pairs, but each angle gets counted twice, so divide by 2."

