- expr: '2'
  misconception_id: MISC.NUM.COMPOSITE-FACTORS-LEFT
solution_steps_i18n:
  en-IN:
    canonical:
    - Do not stop at {{p}} x {{p}} x {{q}} treating "{{p}} x {{p}}" as one leftover chunk — {{p}} and {{q}} are each already prime.
    - Counted with repetition, {{p}} appears twice and {{q}} once, so there are 3 prime factors in total.
hints_i18n:
  en-IN:
  - Make sure every factor you count is actually prime, not a product still waiting to be broken down.
