# Authored 2026-07-29 (Class 6 servable coverage, Implementation Unit U5).
# NUM.FACTORS.MULTIPLES — "next multiple after n" (n itself already a
# multiple of k, via gcd(n,k)==k). The swap distractor offers the factor k
# itself as if it answered "what's the next multiple" (MISC.NUM.
# FACTOR-MULTIPLE-SWAP). Collision algebra checked by hand for every
# n>k>=2 with k|n: n+k = n*k only at n=k=2 (excluded, n>k>=2 range starts
# at n=10); n+k = n+1 only if k=1 (excluded, k>=2); n+k = k only if n=0
# (excluded, n>=10). Distractor pairs likewise never coincide within the
# declared ranges — see the per-pair reasoning kept in the authoring notes
# for this batch.
template_id: TPL.NUM.FACTORS.NEXTMULTIPLE.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - NUM.FACTORS.MULTIPLES
question_type: mcq_4
cognitive_level: application
difficulty: 0.8
difficulty_prior: hard
estimated_time_sec: 40
calculator_allowed: false
diagram_required: false
context_tags:
  - sports
exam_contexts:
  - SCHOOL_EXAM

variables:
  n: { type: int, range: [10, 90] }
  k: { type: int, range: [2, 9] }

constraints:
  - "gcd(n, k) == k"
  - "n > k"

localization_slots: []
stem_i18n:
  en-IN: "{{n}} is a multiple of {{k}}. What is the next multiple of {{k}} after {{n}}?"

answer: "n + k"

distractors:
  - expr: "k"
    misconception_id: MISC.NUM.FACTOR-MULTIPLE-SWAP
  - expr: "n * k"
    misconception_id: null
  - expr: "n + 1"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "{{n}} is already a multiple of {{k}}."
      - "The next multiple of {{k}} is {{k}} more than {{n}}."
      - "{{n}} + {{k}} gives the next multiple."

hints_i18n:
  en-IN:
    - "Multiples of {{k}} are {{k}} apart from each other."
    - "Add {{k}} to {{n}} — don't just restate the factor {{k}}."

tts: false
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
