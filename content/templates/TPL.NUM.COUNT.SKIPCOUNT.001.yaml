# Class 6 servable coverage plan, U4. NUM.COUNT: skip-counting forward from
# a start value by a fixed step, a fixed number of times — the counting-in-
# groups sequence task (distinct in shape from the array/rows-and-columns
# grouping in TPL.NUM.COUNT.GROUPS.WORD.001).
template_id: TPL.NUM.COUNT.SKIPCOUNT.001
skill_ids:
  - NUM.COUNT
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: medium
estimated_time_sec: 30
calculator_allowed: false
diagram_required: false
context_tags:
  - games
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [1, 20] }
  b: { type: int, range: [2, 10] }
  c: { type: int, range: [2, 6] }

constraints: []

stem_i18n:
  en-IN: "Starting at {{a}} and counting up by {{b}}s, {{c}} times, what number do you reach?"
localization_slots: []

answer: "a + b*c"

distractors:
  - expr: "a + b + c"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Each count adds {{b}} more."
      - "Counting {{c}} times adds {{b}} x {{c}} in total."
      - "Start at {{a}} and add {{b}} x {{c}}."

hints_i18n:
  en-IN:
    - "Skip counting means adding the same step each time."
    - "Multiply the step size by the number of counts, then add the start."

