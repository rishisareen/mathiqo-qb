# Class 6 servable coverage, Implementation Unit U7: DATA.BARGRAPH batch.
# Reverse-direction reading: given a value to reach and the value each
# gridline represents, find how many gridlines are needed. Same gcd-exact-
# division idiom as TPL.DATA.BARGRAPH.SCALE.CHOICE.001 (gcd(v, k) == k), so
# some rejection is expected and tolerated (KTD5). Easy band, mcq_4; a
# single axis-reading question with no table, so diagram_required stays
# false per the R7/KTD4 convention.
template_id: TPL.DATA.BARGRAPH.GRIDLINES.NEEDED.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - DATA.BARGRAPH
question_type: mcq_4
cognitive_level: application
difficulty: 0.2
difficulty_prior: easy
estimated_time_sec: 40
calculator_allowed: false
diagram_required: false
context_tags:
  - school

variables:
  v: { type: int, range: [10, 60] }
  k: { type: int, range: [2, 6] }

constraints:
  - "gcd(v, k) == k"
  - "v > k"

localization_slots: []
stem_i18n:
  en-IN: "A bar graph's axis is scaled so each gridline represents {{k}} units. A bar needs to reach exactly {{v}} units. How many gridlines up should the bar be drawn?"

answer: "v / k"

distractors:
  - expr: "v"
    misconception_id: MISC.DATA.SCALE-IGNORED
  - expr: "v - k"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Each gridline is worth {{k}} units, so the bar needs enough gridlines to add up to {{v}}."
      - "Divide the target value by the scale: {{v}} / {{k}}."

hints_i18n:
  en-IN:
    - "The bar's height in gridlines is not the same as the value it represents."
    - "Divide the value by the scale to find the number of gridlines."

tts: false
exam_contexts:
  - SCHOOL_EXAM
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
