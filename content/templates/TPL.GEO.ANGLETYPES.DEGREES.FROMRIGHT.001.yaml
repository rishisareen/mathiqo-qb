variables:
  n: { type: int, range: [91, 179] }
constraints: []

stem_i18n:
  en-IN: "An angle measures {{n}} degrees, which is more than a right angle (90 degrees) but less than a straight angle (180 degrees), so it is obtuse. How many degrees more than a right angle is it?"
localization_slots: []

answer: "n - 90"

distractors:
  - expr: "n"
