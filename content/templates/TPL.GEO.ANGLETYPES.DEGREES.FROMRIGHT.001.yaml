# Class 6 Servable Coverage plan, U6: GEO.ANGLE.TYPES depth batch.
# Pure computation (diagram_required: false): tests the right-angle
# boundary (90 degrees) that separates acute from obtuse, by asking how
# far past it an obtuse angle sits. n is constrained strictly above 90 (and
# below 180) so the subtraction never needs an absolute-value builtin
# (none exists in this repo's expression grammar).
template_id: TPL.GEO.ANGLETYPES.DEGREES.FROMRIGHT.001
skill_ids:
