variables:
  r: { type: int, range: [3, 20] }
constraints: []

stem_i18n:
  en-IN: "A circle has centre O and radius {{r}} cm. What is the length of its diameter, in centimetres?"
localization_slots: []

answer: "2 * r"

distractors:
  - expr: "r"
    misconception_id: MISC.GEO.RADIUS-DIAMETER-SWAP
  - expr: "3 * r"
    misconception_id: null
  - expr: "4 * r"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "The diameter is a straight line through the centre from one side of the circle to the other — exactly twice the radius."
      - "Diameter = 2 x {{r}} cm."

hints_i18n:
  en-IN:
    - "The diameter goes all the way across the circle, through the centre — that's twice as far as the radius goes."
    - "Multiply the radius by 2."

