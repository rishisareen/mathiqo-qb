# Authored 2026-07-29 (Class 6 Servable Coverage plan, Implementation Unit
# U7). INT.CONCEPT medium band, numeric_entry format — the abstract
# number-line framing (rather than a real-world dressing), describing the
# marked position in text per R7/KTD4 since this repo serves only numeric
# mcq_4/numeric_entry answers (no images/SVG, KD4).
template_id: TPL.INT.CONCEPT.POINT.001
skill_ids:
  - INT.CONCEPT
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: medium
difficulty: 0.5
estimated_time_sec: 25
calculator_allowed: false
diagram_required: true
context_tags:
  - measurement
exam_contexts:
  - SCHOOL_EXAM
variables:
  n:
    type: int
    range: [1, 20]
constraints: []
localization_slots: []
stem_i18n:
  en-IN: "On a number line, 0 is marked at the centre. A point P lies {{n}} units to the left of 0. Write the integer represented by point P."
# Zero-centred by construction (the bounds are symmetric about 0) with integer
# ticks only, so "{{n}} units to the left of 0" is countable off the line. The
# point carries the stem's own name "P", never its value: the value IS the
# answer (-n), and a numeric label there would leak it (figure plan R9).
figure:
  - kind: number-line
    min_expr: "-n - 1"
    max_expr: "n + 1"
    divisions_expr: "1"
    points:
      - position_expr: "-n"
        label_i18n:
          en-IN: "P"
answer: "-n"
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
      - "Points to the right of 0 are positive; points to the left of 0 are negative."
      - "P is {{n}} units to the left of 0, so P represents -{{n}}."
hints_i18n:
  en-IN:
    - "Left of zero means negative."
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
tts: false
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
