# Stage 2 authored 2026-07-29 (Class 6 servable coverage, Implementation Unit
# U4). Two-digit by two-digit word problem carrying MISC.NUM.MULT.NO-SHIFT in
# a stadium-seating context — deliberately distinct stem shape from
# TPL.NUM.MULT.2D2D.SHIFT.001 (multi-sentence word problem vs. a bare "x"
