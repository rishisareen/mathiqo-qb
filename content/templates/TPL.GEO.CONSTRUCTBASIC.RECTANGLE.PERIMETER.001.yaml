# Class 6 Servable Coverage plan, U6: GEO.CONSTRUCT.BASIC authoring batch.
# Property-based reasoning (R8): tests the equal-opposite-sides consequence
# of a correct rectangle construction, low-guess numeric_entry format.
template_id: TPL.GEO.CONSTRUCTBASIC.RECTANGLE.PERIMETER.001
skill_ids:
  - GEO.CONSTRUCT.BASIC
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: medium
estimated_time_sec: 35
calculator_allowed: false
diagram_required: true
context_tags:
  - school

variables:
  l: { type: int, range: [7, 12] }
  w: { type: int, range: [2, 6] }
constraints: []

stem_i18n:
  en-IN: "A rectangle is constructed with a ruler and compass so opposite sides come out exactly equal: two sides of {{l}} cm and two sides of {{w}} cm. What is the perimeter of the rectangle, in centimetres?"
localization_slots: []

answer: "2 * (l + w)"

distractors: []

solution_steps_i18n:
  en-IN:
    canonical:
      - "A correctly constructed rectangle has two pairs of equal opposite sides: {{l}} cm and {{w}} cm."
      - "Perimeter = 2 x ({{l}} + {{w}}) cm."

hints_i18n:
  en-IN:
    - "Add one length and one width, then double the result."
    - "Perimeter = 2 x (length + width)."

difficulty: 0.5
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
figure:
  # The constructed rectangle, labelled with one length and one width — the two
  # measurements the stem gives. The opposite sides stay unlabelled: they
  # follow from "opposite sides come out exactly equal", which is the property
  # the item tests. The perimeter itself is never drawn; it is the answer.
  - kind: shape
    shape: rectangle
    side_labels:
      - side: 0        # one length
        value_expr: "l"
        unit: "cm"
      - side: 1        # one width
        value_expr: "w"
        unit: "cm"
tts: false
exam_contexts:
  - SCHOOL_EXAM
