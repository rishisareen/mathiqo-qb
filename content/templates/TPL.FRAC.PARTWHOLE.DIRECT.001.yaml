    - 4
    - 6
constraints:
- a < b
localization_slots: []
stem_i18n:
  en-IN: A shape is divided into {{b}} equal parts, and {{a}} of them are shaded.
    What fraction is shaded?
answer: simplify(a / b)
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
    - 'The denominator is the total number of equal parts: {{b}}.'
    - 'The numerator is the number of shaded parts: {{a}}.'
hints_i18n:
  en-IN:
  - The bottom number is the total parts; the top number is the shaded parts.
template_version: 1.0.0
bank_version: dev
graph_version: 1.0.0
difficulty: 0.2
figure:
  # The whole divided into b equal parts, a of them shaded (KTD9: authored as
  # groups, since b varies per variant and a static list would contradict the
  # stem on most of them). The stem says only "a shape"; a rectangle keeps this
  # easy band visually parallel to the unequal-parts bands, where the only
  # difference that matters is that those parts are NOT equal.
  - kind: region
    shape: rectangle
    parts:
      - weight_expr: "1"
        count_expr: "a"
        shaded: true
      - weight_expr: "1"
        count_expr: "b - a"
        shaded: false
tts: false
