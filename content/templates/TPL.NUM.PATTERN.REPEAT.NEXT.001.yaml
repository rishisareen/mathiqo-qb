# Stage 2 authored 2026-07-29 (Class 6 servable coverage, Implementation Unit
# U4). Simple 2-cycle repeating pattern (not a growing/arithmetic sequence) —
# distinct from the ARITH.*/GROW.* siblings, which are all constant- or
# growing-difference sequences. Distractor `a` represents continuing the
# pattern one position early (mistaking where in the cycle position 5 falls);
# no registered misconception targets this specific error, so it is
# deliberately null rather than forced onto MISC.NUM.PATTERN-CONSTANT-DIFF,
# which is about jump-size reasoning that doesn't apply to a repeating cycle.
