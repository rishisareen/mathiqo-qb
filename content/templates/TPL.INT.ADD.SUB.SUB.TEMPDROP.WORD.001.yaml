# Class 6 servable coverage plan, U7. INT.ADD.SUB: subtracting a negative
# integer, dressed as a temperature-drop word problem — application-level
# sibling of TPL.INT.ADD.SUB.SUB.POSNEG.DIRECT.001. The fall in temperature
# is a - b; the MISC.INT.SUB-MAKES-SMALLER distractor "a + b" reproduces
# treating the negative evening reading as if it were positive, reporting a
# smaller fall than actually occurred.
template_id: TPL.INT.ADD.SUB.SUB.TEMPDROP.WORD.001
skill_ids:
  - INT.ADD.SUB
question_type: mcq_4
cognitive_level: application
difficulty_prior: medium
estimated_time_sec: 40
calculator_allowed: false
diagram_required: false
context_tags:
  - weather
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [1, 9] }
  b: { type: int, range: [-9, -1] }

constraints: []

stem_i18n:
  en-IN: "The temperature at the start of the day was {{a}}°C. By evening it had dropped to {{b}}°C. By how many degrees did the temperature fall?"
localization_slots: []

answer: "a - b"

distractors:
  - expr: "a + b"
    misconception_id: MISC.INT.SUB-MAKES-SMALLER

solution_steps_i18n:
  en-IN:
    canonical:
      - "The fall in temperature is the starting reading minus the ending reading: {{a}} - {{b}}."
      - "Since {{b}} is below zero, subtracting it adds its distance from zero on top of {{a}}."

hints_i18n:
  en-IN:
    - "The amount the temperature fell is the start reading minus the end reading."
    - "Subtracting a negative ending temperature makes the fall bigger, not smaller."

