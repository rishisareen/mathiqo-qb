# U6 authoring increment (Class 6 Ch. 9 Symmetry), drafted 2026-07-29.
# Named-shape stem: rectangle PQRS with distinct side lengths (not a square),
# whose rotational order is a fixed fact (2) independent of the exact side
# lengths — genuine variables carried through the stem for realism.
