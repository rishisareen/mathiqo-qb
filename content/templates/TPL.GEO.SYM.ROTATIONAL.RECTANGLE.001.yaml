variables:
  l:
    type: int
    range:
    - 3
    - 12
  b:
    type: int
    range:
    - 3
    - 12
constraints:
- l != b
localization_slots: []
stem_i18n:
  en-IN: Rectangle PQRS has PQ = {{l}} cm and QR = {{b}} cm, with PQ not equal
    to QR. What is the order of its rotational symmetry?
answer: '2'
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
    - Turning rectangle PQRS by 180 degrees about its centre maps it exactly
      onto itself.
    - Turning it by 90 degrees does not work, since PQ is not equal to QR, so
      the rectangle is not a square.
    - It matches itself twice in a full turn, so the order of rotational
      symmetry is 2.
hints_i18n:
  en-IN:
  - Try turning the rectangle by 180 degrees about its centre — does it look
    the same?
  - A 90-degree turn only works for a square, not a general rectangle.
