stem_i18n:
  en-IN: "Triangular numbers count the dots in a triangle arrangement: 1, 3, 6, 10, ... What is the {{n}}th triangular number?"

answer: "n * (n + 1) / 2"

distractors: []

solution_steps_i18n:
  en-IN:
    canonical:
      - "The nth triangular number is the sum of the first n whole numbers: 1 + 2 + ... + n."
      - "Use the shortcut n x (n + 1) / 2 with n = {{n}}."

hints_i18n:
  en-IN:
    - "Try building the triangle row by row: row 1 has 1 dot, row 2 has 2 dots, and so on up to row {{n}}."
    - "Add the row counts together, or use n x (n + 1) / 2."

