stem_i18n:
  en-IN: "A rectangular mirror frame is {{a}} cm long and {{b}} cm wide. Framing material costs Rs {{rate}} per centimetre of the frame's perimeter. What is the total cost of framing the mirror, in rupees?"

answer: "2 * (a + b) * rate"

distractors:
  - expr: "(a + b) * rate"
    misconception_id: MISC.MEAS.PERIMETER-MISSED-SIDE
  - expr: "a * b * rate"
    misconception_id: MISC.MEAS.PERIMETER-AREA-CONFUSED

solution_steps_i18n:
  en-IN:
    canonical:
      - "First find the perimeter of the frame: 2 x ({{a}} + {{b}}) cm."
      - "Multiply the perimeter by the cost per centimetre, Rs {{rate}}, to get the total cost."

hints_i18n:
  en-IN:
    - "You need the perimeter of the frame first — remember the frame has two lengths and two widths."
    - "Once you have the perimeter, multiply it by the rate per centimetre."

