# Authored 2026-07-29 (Class 6 Servable Coverage plan, U5). Forces a 0 in
# the tens place (h hundreds, 0 tens, o ones) so the correct standard form
# needs the placeholder zero written in — directly targets
# MISC.NUM.ZERO-PLACEHOLDER, whose signature error is exactly "10*h + o"
# (concatenating the nonzero digits and skipping the medial zero, e.g.
# writing "three hundred five" as 35 instead of 305).
template_id: TPL.NUM.PLACE.VALUE.ZEROMEDIAL.001
template_version: "1.0.0"
bank_version: "dev"
