difficulty_prior: medium
estimated_time_sec: 35
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  h: { type: int, range: [1, 9] }
  o: { type: int, range: [1, 9] }

constraints: []

localization_slots: []
stem_i18n:
  en-IN: "Write the number that has {{h}} hundreds, 0 tens, and {{o}} ones, in standard form."

answer: "100 * h + o"

distractors:
  - expr: "10 * h + o"
    misconception_id: MISC.NUM.ZERO-PLACEHOLDER
  - expr: "100 * h + 10 * o"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "There are {{h}} hundreds, 0 tens, and {{o}} ones — every place needs a digit, even the tens place with 0."
      - "Writing the digits in order (hundreds, tens, ones) gives {{h}}0{{o}}, which is 100 x {{h}} + {{o}}."

hints_i18n:
  en-IN:
    - "Don't skip the tens place just because it's 0 — every place still needs a digit written in."
    - "The number has three digits: hundreds, tens, ones. The tens digit here is 0, so the number is {{h}}0{{o}}."

