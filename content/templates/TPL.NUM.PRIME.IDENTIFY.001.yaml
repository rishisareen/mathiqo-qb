# Authored 2026-07-29 (Class 6 servable coverage, Implementation Unit U5).
# NUM.PRIME — direct "which of these is prime" identification. n is curated
# to {2,3,5,7} (range [2,7] excluding 4 and 6), guaranteed prime by the
# author, never tested at runtime. Distractors are fixed constants clear of
# n's domain: 1 (MISC.NUM.ONE-IS-PRIME — a child who believes 1 is prime),
# and 4, 9 (composite traps, untagged). 1, 4, 9 are all outside {2,3,5,7}
# so none can ever collide with the answer n; 1, 4, 9 are also pairwise
# distinct constants, so no distractor-distractor collision is possible.
