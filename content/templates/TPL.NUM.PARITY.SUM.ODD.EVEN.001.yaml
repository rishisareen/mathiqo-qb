# Authored 2026-07-29 (Class 6 Servable Coverage plan, U5). Parity-of-a-sum
# reasoning (odd + even) as a numeric_entry proxy — depth beyond classifying
# a single number, per NUM.PARITY's "reason about the parity of sums"
# description.
template_id: TPL.NUM.PARITY.SUM.ODD.EVEN.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - NUM.PARITY
question_type: numeric_entry
cognitive_level: application
difficulty: 0.5
difficulty_prior: medium
estimated_time_sec: 30
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [1, 50] }
  b: { type: int, range: [1, 50] }

constraints:
  - "a % 2 == 1"
  - "b % 2 == 0"

localization_slots: []
stem_i18n:
  en-IN: "{{a}} is an odd number and {{b}} is an even number. Is {{a}} + {{b}} odd or even? Type 0 for even or 1 for odd."

answer: "(a + b) % 2"

distractors: []

solution_steps_i18n:
  en-IN:
    canonical:
      - "{{a}} is odd, so it leaves one unpaired when split into pairs. {{b}} is even, so it splits into pairs exactly."
      - "Adding an odd number and an even number always leaves exactly one unpaired, so the sum {{a}} + {{b}} is odd."

hints_i18n:
  en-IN:
    - "One of {{a}}, {{b}} pairs up completely and the other always leaves one left over."
    - "odd + even is always odd — try it with a couple of small examples if you're unsure."

tts: false
