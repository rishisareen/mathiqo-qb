# U6 authoring increment (Class 6 Ch. 9 Symmetry), drafted 2026-07-29.
# Same regular-n-gon fact as TPL.GEO.SYM.ROTATIONAL.REGULAR-NGON.001, but as
# an MCQ whose n + 1 distractor directly targets
# MISC.GEO.SYM.ROTATIONAL-ORDER-OFFBYONE: counting the starting position as
# an extra match and inflating the order by one.
template_id: TPL.GEO.SYM.ROTATIONAL.REGULAR-NGON-OFFBYONE.001
