variables:
  n:
    type: int
    range:
    - 3
    - 9
constraints: []
localization_slots: []
stem_i18n:
  en-IN: A regular {{n}}-gon is rotated about its centre. What is the order of
    its rotational symmetry?
answer: n
distractors:
- expr: n + 1
  misconception_id: MISC.GEO.SYM.ROTATIONAL-ORDER-OFFBYONE
- expr: n - 1
  misconception_id: null
- expr: '1'
  misconception_id: null
solution_steps_i18n:
  en-IN:
    canonical:
    - Count the positions where the {{n}}-gon looks the same during one full
      turn, without counting the starting position a second time when you
      return to it.
    - A regular {{n}}-gon matches itself {{n}} times in a full turn, so its
      order of rotational symmetry is {{n}}, not {{n}} + 1.
hints_i18n:
  en-IN:
  - Don't count the starting position as an extra match — it's the same 0-degree
    position you return to at the end of the turn.
  - The order of rotational symmetry equals the number of sides for a regular
    polygon.
