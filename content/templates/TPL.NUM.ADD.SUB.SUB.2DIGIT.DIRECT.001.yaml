# Class 6 servable coverage plan, U4. NUM.ADD.SUB: direct 2-digit
# subtraction with regrouping (borrowing). Digit-decomposed variables as in
# TPL.NUM.ADD.SUB.ADD.2DIGIT.DIRECT.001. The SUB-SMALLER-FROM-LARGER
# distractor reproduces the signature bug exactly: 52 - 38 -> tens 5-3=2,
# ones |2-8|=6 (subtracts the smaller ones digit from the larger instead of
# borrowing), written together as 26, i.e. 10*(a1-b1) - a0 + b0. Guarded to
# fire only when borrowing is actually needed (a0 < b0).
template_id: TPL.NUM.ADD.SUB.SUB.2DIGIT.DIRECT.001
skill_ids:
  - NUM.ADD.SUB
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: easy
estimated_time_sec: 30
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a1: { type: int, range: [5, 9] }
  a0: { type: int, range: [0, 9] }
  b1: { type: int, range: [1, 4] }
  b0: { type: int, range: [0, 9] }

constraints: []

stem_i18n:
  en-IN: "What is {{a1}}{{a0}} - {{b1}}{{b0}}?"
localization_slots: []

answer: "10*a1 + a0 - (10*b1 + b0)"

distractors:
  - expr: "10*(a1-b1) - a0 + b0"
    misconception_id: MISC.NUM.SUB-SMALLER-FROM-LARGER
    only_if: "a0 < b0"
  - expr: "10*b1 + b0 - 10*a1 - a0"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Look at the ones column: {{a0}} minus {{b0}}."
      - "If the top ones digit is smaller, borrow a ten from the tens column first."
      - "Subtract the tens column, remembering any borrow."

hints_i18n:
  en-IN:
    - "If the top digit in a column is smaller than the bottom digit, borrow from the next column."
    - "Never subtract the top digit from the bottom digit — always subtract bottom from top after borrowing."

