# Class 6 servable coverage, Implementation Unit U6: MEAS.AREA.FORMULA batch.
# Figure made of several rectangles: an L-shaped hall as two independent
# rectangular sections, area = a*b + c*d. Medium band, numeric_entry.
template_id: TPL.MEAS.AREA.FORMULA.LSHAPE.COMPOSITE.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - MEAS.AREA.FORMULA
question_type: numeric_entry
cognitive_level: application
difficulty: 0.5
difficulty_prior: medium
estimated_time_sec: 55
calculator_allowed: false
diagram_required: true
context_tags:
  - flooring
  - home

variables:
  a: { type: int, range: [3, 8] }
  b: { type: int, range: [3, 8] }
  c: { type: int, range: [3, 8] }
  d: { type: int, range: [3, 8] }

constraints: []

localization_slots: []
stem_i18n:
  en-IN: "An L-shaped hall is made of two rectangular sections: one measuring {{a}} m by {{b}} m, and the other measuring {{c}} m by {{d}} m. What is the total floor area of the hall, in square metres?"

answer: "a*b + c*d"

distractors:
  - expr: "a + b + c + d"
    misconception_id: MISC.MEAS.AREA-ADD-SIDES
  - expr: "(a + c) * (b + d)"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Find the area of each rectangular section separately: {{a}} x {{b}} and {{c}} x {{d}}."
      - "Add the two areas together to get the total floor area."

hints_i18n:
  en-IN:
    - "Split the L-shape into its two rectangular sections and find each area on its own."
    - "Add the two section areas — don't just add all four side lengths, and don't treat it as one big rectangle."

figure:
  # One L-shaped hall, not two loose rectangles: the two sections share the
  # step that makes it an L. Walking the six-sided outline from the first
  # section's bottom edge, side 0 is that section's a and side 1 its b;
  # sides 3 and 4 are the second section's d and c. Sides 2 and 5 -- the
  # step (a - c) and the full height (b + d) -- are derived, not given in
  # the stem, so they stay unlabelled. The total area is never labelled.
  - kind: shape
    shape: composite-l
    side_labels:
      - side: 0
        value_expr: "a"
        unit: "m"
      - side: 1
        value_expr: "b"
        unit: "m"
      - side: 3
        value_expr: "d"
        unit: "m"
      - side: 4
        value_expr: "c"
        unit: "m"
tts: false
exam_contexts:
  - SCHOOL_EXAM
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
