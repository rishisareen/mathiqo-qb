# Class 6 servable coverage, Implementation Unit U7: DATA.BARGRAPH batch.
# Two-bar comparison, labeled text table (diagram_required: true). g1/g2
# ranges are disjoint (Bar A 5-9, Bar B 1-4) so Bar A always reaches more
# gridlines than Bar B — zero constraint rejection. Medium band,
# numeric_entry.
template_id: TPL.DATA.BARGRAPH.COMPARE.DIFFERENCE.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - DATA.BARGRAPH
question_type: numeric_entry
cognitive_level: application
difficulty: 0.5
difficulty_prior: medium
estimated_time_sec: 50
calculator_allowed: false
diagram_required: true
context_tags:
  - sports

variables:
  g1: { type: int, range: [5, 9] }
  g2: { type: int, range: [1, 4] }
  k: { type: int, range: [2, 5] }

constraints: []

localization_slots: []
stem_i18n:
  en-IN: "On a bar graph, Bar A reaches {{g1}} gridlines and Bar B reaches {{g2}} gridlines; each gridline represents {{k}} units. By how much does Bar A exceed Bar B?"

answer: "(g1 - g2) * k"

distractors:
  - expr: "g1 - g2"
    misconception_id: MISC.DATA.SCALE-IGNORED

solution_steps_i18n:
  en-IN:
    canonical:
      - "Bar A's value is {{g1}} x {{k}}, and Bar B's value is {{g2}} x {{k}}."
      - "Subtract Bar B's value from Bar A's value to find the difference."

hints_i18n:
  en-IN:
    - "Convert both gridline counts to actual values using the scale first."
    - "Find each bar's value, then subtract the smaller from the larger."

figure:
  - kind: bar-graph
    scale_expr: "k"
    bars:
      - label_i18n:
          en-IN: "Bar A"
        gridlines_expr: "g1"
      - label_i18n:
          en-IN: "Bar B"
        gridlines_expr: "g2"

tts: false
exam_contexts:
  - SCHOOL_EXAM
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
