# Class 6 servable coverage plan, U7. INT.ADD.SUB: subtracting a negative
# integer from another negative integer, the hardest of the four sign
# combinations (double-negative territory). The MISC.INT.SUB-MAKES-SMALLER
# distractor "a + b" reproduces keeping b's original negative value instead
# of flipping its sign (e.g. -3 - (-7) computed as -3 + (-7) = -10 instead
# of 4), matching the expectation that subtraction should shrink the
# result. Always distinct from the true answer a - b since that would
# require b == 0, which the negative-only range for b excludes.
template_id: TPL.INT.ADD.SUB.SUB.NEGNEG.DIRECT.001
skill_ids:
  - INT.ADD.SUB
question_type: mcq_4
cognitive_level: procedural
difficulty_prior: hard
estimated_time_sec: 40
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [-9, -1] }
  b: { type: int, range: [-9, -1] }

constraints: []

stem_i18n:
  en-IN: "Work out {{a}} - {{b}}."
localization_slots: []

answer: "a - b"

distractors:
  - expr: "a + b"
    misconception_id: MISC.INT.SUB-MAKES-SMALLER

solution_steps_i18n:
  en-IN:
    canonical:
      - "Subtracting {{b}} (a negative number) is the same as adding the positive version of {{b}}."
      - "So {{a}} - {{b}} is really {{a}} plus a positive number, which moves you up the number line, not down."

hints_i18n:
  en-IN:
    - "Two negatives in a row (subtracting a negative) turn into addition."
    - "Don't assume subtracting always makes the answer smaller — check the sign of what you're subtracting."

