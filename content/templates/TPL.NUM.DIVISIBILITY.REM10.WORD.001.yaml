stem_i18n:
  en-IN: A shopkeeper packs {{n}} pencils into boxes of 10, filling as many boxes as possible. How many pencils are left over after the last full box?
answer: n % 10
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
    - The number of full boxes is found by dividing {{n}} by 10 and ignoring the remainder.
    - The leftover pencils are exactly the remainder when {{n}} is divided by 10 — its last digit.
hints_i18n:
  en-IN:
  - A number's remainder on division by 10 is simply its last digit.
