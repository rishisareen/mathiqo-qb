localization_slots: []
stem_i18n:
  en-IN: A teacher has {{a}} pencils and {{b}} erasers. She wants to make identical gift bags, using every pencil and eraser with none left over. What is the greatest number of bags she can make?
answer: gcd(a, b)
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
    - The number of bags must divide both {{a}} and {{b}} exactly, since nothing is left over.
    - The greatest such number is the highest common factor of {{a}} and {{b}}.
hints_i18n:
  en-IN:
  - Find a number that divides both {{a}} and {{b}} exactly — the greatest one gives the most bags.
