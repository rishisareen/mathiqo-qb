stem_i18n:
  en-IN: "One box has 10 x {{a_tens}} + {{a_ones}} pencils and another box has 10 x {{b_tens}} + {{b_ones}} pencils. Round each amount to the nearest 10, then estimate the total."

answer: "10 * a_tens + 10 * b_tens"

