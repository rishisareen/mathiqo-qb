# Authored 2026-07-29 (Class 6 servable coverage, Implementation Unit U5).
# NUM.ESTIMATE — estimating a sum by rounding both addends to the nearest
# 10 before adding, per the "estimate before computing" strand of this
# skill. Both addends use the tens/ones split (ones in [1,4], round-down,
# zero rejection) so the item stays purely about the estimation step rather
# than about direction judgement (already covered by the ROUND10 pair).
# ones is restricted to [1,4] rather than [0,4] specifically so the "exact
# sum" distractor can never collide with the rounded-sum answer (a zero
# ones digit on both addends would make the two coincide).
