stem_i18n:
  en-IN: A regular polygon has {{n}} sides (a regular {{n}}-gon). What is the
    order of its rotational symmetry — the number of positions in one full
    turn where it looks exactly the same?
answer: n
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
    - A regular {{n}}-gon looks exactly the same after turning it by
      360/{{n}} degrees about its centre.
    - This happens {{n}} times in one full turn, so its order of rotational
      symmetry is {{n}}.
hints_i18n:
  en-IN:
  - How many equal turns fit into one full 360-degree turn for this shape?
  - For a regular polygon, the order of rotational symmetry equals the number
    of sides.
