# Authored 2026-07-29 (Class 6 Servable Coverage plan, Implementation Unit
# U7). FRAC.NUMLINE medium band: the "improper fractions ... at depth"
# extension from a 0-to-1 line to a 0-to-2 line (skill description), so the
# marked fraction can exceed 1. Reuses MISC.FRAC.NUMLINE-COUNT-MARKS with
# the same numerator/denominator off-by-one distractor shapes as the easy
# band, now over the wider two-unit domain.
template_id: TPL.FRAC.NUMLINE.DEPTH.001
skill_ids:
  - FRAC.NUMLINE
question_type: mcq_4
cognitive_level: procedural
difficulty_prior: medium
difficulty: 0.5
estimated_time_sec: 45
calculator_allowed: false
diagram_required: true
accepted_answer_forms: improper fraction or an equivalent mixed-number value accepted
context_tags:
  - measurement
exam_contexts:
  - SCHOOL_EXAM
variables:
  d:
    type: int
    range: [3, 6]
  k:
    type: int
    range: [1, 11]
constraints:
  - "k <= 2 * d - 1"
localization_slots: []
stem_i18n:
  en-IN: "A number line runs from 0 to 2. Each unit interval (0 to 1, and 1 to 2) is divided into {{d}} equal parts. What fraction is marked at the point that is {{k}} parts to the right of 0?"
# The marked point carries no label: its value IS the answer (k/d), so a label
# would hand it to the student (figure plan R9 leak rule).
figure:
  - kind: number-line
    min_expr: "0"
    max_expr: "2"
    divisions_expr: "d"
    points:
      - position_expr: "k / d"
answer: "simplify(k / d)"
distractors:
  - expr: "(k + 1) / d"
    misconception_id: MISC.FRAC.NUMLINE-COUNT-MARKS
  - expr: "k / (d + 1)"
    misconception_id: MISC.FRAC.NUMLINE-COUNT-MARKS
solution_steps_i18n:
  en-IN:
    canonical:
      - "Each unit interval is split into {{d}} equal parts, so every part is worth 1/{{d}}."
      - "The point is {{k}} parts to the right of 0, so its value is {{k}}/{{d}} — this can be more than 1 whole once you pass the mark for 1."
hints_i18n:
  en-IN:
    - "Count equal parts, not tick marks, and keep going past 1 if the point is further along."
    - "The denominator stays {{d}} the whole way along the line, even past the mark for 1."
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
tts: false
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
