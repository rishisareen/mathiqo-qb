# Class 6 servable coverage plan, U4. NUM.COUNT: writing a numeral from a
# larger stated collection (thousands/hundreds/tens/ones) — the hard-band
# depth extension of TPL.NUM.COUNT.NUMERAL.BUILD.001's hundreds/tens/ones
# version.
template_id: TPL.NUM.COUNT.NUMERAL.LARGE.001
skill_ids:
  - NUM.COUNT
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: hard
estimated_time_sec: 50
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [1, 9] }
  b: { type: int, range: [0, 9] }
  c: { type: int, range: [0, 9] }
  d: { type: int, range: [0, 9] }

constraints: []

stem_i18n:
  en-IN: "A number is made up of {{a}} thousands, {{b}} hundreds, {{c}} tens, and {{d}} ones. What is the number?"
localization_slots: []

answer: "1000*a + 100*b + 10*c + d"

distractors:
  - expr: "a + b + c + d"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Thousands are worth 1000 each: {{a}} x 1000."
      - "Hundreds are worth 100 each: {{b}} x 100."
      - "Tens are worth 10 each: {{c}} x 10."
      - "Add all the place values together with the {{d}} ones."

hints_i18n:
  en-IN:
    - "Each place is worth ten times the place to its right."
    - "Add the place values, don't just add the digits."

