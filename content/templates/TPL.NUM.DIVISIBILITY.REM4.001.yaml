localization_slots: []
stem_i18n:
  en-IN: What is the remainder when {{n}} is divided by 4?
answer: n % 4
distractors:
- expr: n % 10
  misconception_id: MISC.NUM.DIVISIBILITY-LAST-DIGIT-ALWAYS
solution_steps_i18n:
  en-IN:
    canonical:
    - The test for 4 needs more than just the last digit — look at the last two digits of {{n}}.
    - Divide that two-digit number by 4; the remainder is the same as dividing {{n}} itself by 4.
hints_i18n:
  en-IN:
  - Checking only the last digit works for tests of 2, 5 and 10, but not for 4.
  - Look at the number formed by the last two digits of {{n}}.
