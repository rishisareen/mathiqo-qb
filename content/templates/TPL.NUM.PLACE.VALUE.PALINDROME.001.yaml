# Authored 2026-07-29 (Class 6 Servable Coverage plan, U5). Hard-band depth:
# builds a 3-digit palindrome h-t-h and asks for its standard form, the
# palindromic-number digit puzzle named in NUM.PLACE.VALUE's Class 6 mapping
# row. The MISC.NUM.PLACE-FACE-VALUE distractor "2*h + t" models a learner
# who sums the face values of the three digits (h, t, h) with no place
# multipliers at all, and never numerically collides with the correct
# 101*h + 10*t (2h + t = 101h + 10t forces -99h = 9t, impossible for
# h >= 1, t >= 0). The second distractor "110*h + t" (swapping which digit
# gets the tens-multiplier) collides with the answer only when h == t — a
# coincidental subset of variants, not an algebraic identity, per the
# distractor-collision convention documented in tools/item_verify.py.
