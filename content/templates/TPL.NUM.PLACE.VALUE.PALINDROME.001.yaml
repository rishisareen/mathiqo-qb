stem_i18n:
  en-IN: "A palindrome number reads the same forwards and backwards. Using the digits {{h}}, {{t}}, {{h}} as the hundreds, tens, and ones digits, what is the palindrome {{h}}{{t}}{{h}} in standard form?"

answer: "101 * h + 10 * t"

distractors:
  - expr: "2 * h + t"
    misconception_id: MISC.NUM.PLACE-FACE-VALUE
  - expr: "110 * h + t"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "The palindrome has hundreds digit {{h}}, tens digit {{t}}, and ones digit {{h}} again."
      - "Multiply each digit by its place and add: (100 x {{h}}) + (10 x {{t}}) + (1 x {{h}}), which is 101 x {{h}} + 10 x {{t}}."

hints_i18n:
  en-IN:
    - "Write out the three digits in order — hundreds, tens, ones — and give each one its own place value before adding."
    - "The hundreds digit and the ones digit are both {{h}}, but they're worth very different amounts because they're in different places."

