# Class 6 servable coverage, Implementation Unit U6: MEAS.AREA.FORMULA batch.
# Triangle area as half of a surrounding rectangle, at depth. The base is
# written as "2 x {{k}}" directly in the stem so it is always even by
# construction, making the triangle's area exactly k*h with no fractional
# risk or constraint-rejection from a parity constraint. Hard band, mcq_4.
template_id: TPL.MEAS.AREA.FORMULA.TRIANGLE.HALFRECT.001
template_version: "1.0.0"
