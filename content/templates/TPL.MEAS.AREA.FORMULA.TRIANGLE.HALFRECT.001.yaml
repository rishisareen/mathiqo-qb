variables:
  k: { type: int, range: [2, 7] }
  h: { type: int, range: [3, 10] }

constraints: []

localization_slots: []
stem_i18n:
  en-IN: "A triangle sits exactly inside a rectangle that surrounds it, with the rectangle's base measuring 2 x {{k}} cm and its height measuring {{h}} cm. The triangle's area is half of the surrounding rectangle's area. What is the triangle's area, in square centimetres?"

answer: "k * h"

distractors:
  - expr: "2 * k * h"
    misconception_id: null
  - expr: "2 * k + h"
    misconception_id: MISC.MEAS.AREA-ADD-SIDES

solution_steps_i18n:
  en-IN:
    canonical:
      - "The surrounding rectangle's area is (2 x {{k}}) x {{h}}."
      - "The triangle's area is half of that: (2 x {{k}} x {{h}}) / 2 = {{k}} x {{h}}."

hints_i18n:
  en-IN:
    - "First work out the area of the whole surrounding rectangle."
    - "The triangle is exactly half the rectangle's area — don't forget to halve it, and don't just add the base and height."

