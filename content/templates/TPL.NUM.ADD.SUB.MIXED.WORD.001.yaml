# Class 6 servable coverage plan, U4. NUM.ADD.SUB: hard-band two-step word
# problem combining an addition and a subtraction in sequence — application
# depth beyond either single-operation template, certified in the
# low-guess numeric_entry format.
template_id: TPL.NUM.ADD.SUB.MIXED.WORD.001
skill_ids:
  - NUM.ADD.SUB
question_type: numeric_entry
cognitive_level: application
difficulty_prior: hard
estimated_time_sec: 60
calculator_allowed: false
diagram_required: false
context_tags:
  - games
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [10, 30] }
  b: { type: int, range: [5, 20] }
  c: { type: int, range: [5, 20] }

constraints:
  - "a + b >= c"

stem_i18n:
  en-IN: "{{name1}} had {{a}} marbles. {{name1}} won {{b}} more marbles, then gave away {{c}} marbles to a friend. How many marbles does {{name1}} have now?"
localization_slots:
  - name1

answer: "a + b - c"

distractors:
  - expr: "a - b + c"
    misconception_id: null
  - expr: "a + b + c"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "First add the marbles won: {{a}} + {{b}}."
      - "Then subtract the marbles given away: that result minus {{c}}."

hints_i18n:
  en-IN:
    - "This is a two-step problem: add first, then subtract."
    - "Winning marbles increases the total; giving them away decreases it."

template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
difficulty: 0.8
tts: false
