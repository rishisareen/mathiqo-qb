# Authored 2026-07-29 (Class 6 Servable Coverage plan, Implementation Unit
# U7). FRAC.NUMLINE easy band, numeric_entry format (student-model doc §7
# low-guess certification format) — a real-world ribbon/measuring context
# instead of an abstract number line, dressed differently from
# TPL.FRAC.NUMLINE.READ.001 to avoid stem collisions while covering the
# same "point reached by dividing a unit interval into equal parts" idea.
template_id: TPL.FRAC.NUMLINE.IDENTIFY.001
skill_ids:
  - FRAC.NUMLINE
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: easy
difficulty: 0.2
estimated_time_sec: 30
calculator_allowed: false
diagram_required: true
accepted_answer_forms: simplest form only
context_tags:
  - measurement
exam_contexts:
  - SCHOOL_EXAM
variables:
  d:
    type: int
    range: [4, 9]
  k:
    type: int
    range: [1, 7]
constraints:
  - "k < d"
localization_slots: []
stem_i18n:
  en-IN: "A ribbon exactly 1 metre long is marked off from 0 to 1 in {{d}} equal parts. A bead is threaded {{k}} parts along from the 0 end. What fraction of the ribbon's length is that?"
answer: "simplify(k / d)"
distractors: []
solution_steps_i18n:
  en-IN:
    canonical:
      - "The ribbon is split into {{d}} equal parts, so each part is 1/{{d}} of the ribbon."
      - "The bead is {{k}} parts along, so it is at {{k}}/{{d}} of the ribbon's length."
hints_i18n:
  en-IN:
    - "The total number of equal parts is the denominator; how far along the bead is gives the numerator."
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
tts: false
provenance:
