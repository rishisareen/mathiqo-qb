variables:
  t1: { type: int, range: [1, 5] }
  t2: { type: int, range: [2, 10] }
  t3: { type: int, range: [4, 16] }
  t4: { type: int, range: [6, 22] }

constraints:
  - "t4 - 2 * t3 + t2 == t3 - 2 * t2 + t1"
  - "(t2 - t1) < (t3 - t2)"

localization_slots: []
stem_i18n:
  en-IN: "Look at this number pattern: {{t1}}, {{t2}}, {{t3}}, {{t4}}, .... What is the next number?"

answer: "3 * t4 - 3 * t3 + t2"

distractors:
  - expr: "2 * t4 - t3"
    misconception_id: MISC.NUM.PATTERN-CONSTANT-DIFF
  - expr: "t4 + (t3 - t2)"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Find the jump between each pair of numbers: {{t2}}-{{t1}}, {{t3}}-{{t2}}, {{t4}}-{{t3}}."
      - "Notice the jumps themselves are growing by the same amount each time."
      - "Find the next jump by continuing that growth, then add it to {{t4}}."

hints_i18n:
  en-IN:
    - "Look at the jumps between the numbers, not just the numbers themselves — are the jumps staying the same or changing?"
    - "The jumps are growing by a fixed amount each time — work out the next jump before adding it to {{t4}}."

