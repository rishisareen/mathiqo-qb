# Stage 2 authored 2026-07-29 (Class 6 servable coverage, Implementation Unit
# U4). Growing pattern with constant second difference (the jumps themselves
# grow by a fixed amount, e.g. 2,5,9,14 with jumps 3,4,5) — direct numeric
# pattern, medium band. t1..t4 are independent declared variables tied by
# one equality constraint enforcing constant second difference
# ("t4-2*t3+t2 == t3-2*t2+t1"), plus a strict-increase constraint on the
# jumps so the constant-difference degenerate case is excluded and the
# pattern is genuinely growing. The correct extrapolation
# (3*t4 - 3*t3 + t2) follows from continuing the constant second difference;
# MISC.NUM.PATTERN-CONSTANT-DIFF's signature error (repeat the last jump:
# 2*t4 - t3) is the direct distractor this item is built to expose.
template_id: TPL.NUM.PATTERN.GROW.NEXT.001
