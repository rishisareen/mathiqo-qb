# Class 6 servable coverage, Implementation Unit U7: DATA.COLLECT.TALLY batch.
# A two-category labeled tally table (R7/KTD4 convention: present the table
# as labeled text in the stem, diagram_required: true). Bundle ranges are
# disjoint (Cricket 4-6 bundles, Football 1-3 bundles) so Cricket's total
# always exceeds Football's regardless of the loose-stroke draw (a bundle gap
# of >=5 always beats a loose-stroke gap of at most 4) — zero constraint
# rejection. Medium band, numeric_entry.
template_id: TPL.DATA.TALLY.TWOCATEGORY.DIFFERENCE.001
template_version: "1.0.0"
bank_version: "dev"
