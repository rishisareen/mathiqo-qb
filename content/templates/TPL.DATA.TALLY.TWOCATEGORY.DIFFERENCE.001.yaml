difficulty: 0.5
difficulty_prior: medium
estimated_time_sec: 50
calculator_allowed: false
diagram_required: true
context_tags:
  - sports

variables:
  b1: { type: int, range: [4, 6] }
  e1: { type: int, range: [0, 4] }
  b2: { type: int, range: [1, 3] }
  e2: { type: int, range: [0, 4] }

constraints: []

localization_slots: []
stem_i18n:
  en-IN: "A class tally for favourite sport shows: Cricket — {{b1}} bundles of five and {{e1}} loose strokes; Football — {{b2}} bundles of five and {{e2}} loose strokes. How many more students chose Cricket than Football?"

answer: "(5 * b1 + e1) - (5 * b2 + e2)"

distractors:
  - expr: "(b1 + e1) - (b2 + e2)"
    misconception_id: MISC.DATA.TALLY-BUNDLE-MISCOUNT

solution_steps_i18n:
  en-IN:
    canonical:
      - "Cricket's total is 5 x {{b1}} + {{e1}}, and Football's total is 5 x {{b2}} + {{e2}}."
      - "Subtract Football's total from Cricket's total to find the difference."

hints_i18n:
  en-IN:
    - "Work out each sport's total first — each bundle is worth 5, not 1."
    - "Once you have both totals, subtract the smaller from the larger."

tts: false
