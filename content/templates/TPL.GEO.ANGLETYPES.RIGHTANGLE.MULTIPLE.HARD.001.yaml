# Hard-band item targeting MISC.GEO.RIGHT-ANGLE-UPRIGHT again: m tilted
# right angles are drawn, each genuinely 90 degrees between its arms, but a
# student who thinks a right angle must be upright refuses to count any of
# them. The answer (m, the correct count) is provably distinct from all
# three distractors for every m >= 2: 0 and 1 are excluded by range, and
# m - 1 differs from m by exactly 1 always.
