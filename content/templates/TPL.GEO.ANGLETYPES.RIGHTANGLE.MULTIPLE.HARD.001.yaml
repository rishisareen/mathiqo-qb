solution_steps_i18n:
  en-IN:
    canonical:
      - "A right angle is defined by its measure (90 degrees between its arms), not by whether it looks upright on the page."
      - "Every one of the {{m}} figures measures exactly 90 degrees, so all {{m}} of them are right angles."

hints_i18n:
