stem_i18n:
  en-IN: "{{m}} angles are drawn around a page, each tilted at a different angle from upright, but every single one has its arms turned exactly a quarter of a full turn apart (90 degrees). A student who believes a right angle must sit upright, like a wall meeting a floor, refuses to count any of them as right angles, insisting there are 0 right angles among the {{m}} figures. Using the correct definition (a right angle is any angle measuring exactly 90 degrees, tilted or not), how many of the {{m}} figures are actually right angles?"
