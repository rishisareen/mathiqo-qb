constraints:
- n % 8 != n % 10
localization_slots: []
stem_i18n:
  en-IN: What is the remainder when {{n}} is divided by 8?
answer: n % 8
distractors:
- expr: n % 10
  misconception_id: MISC.NUM.DIVISIBILITY-LAST-DIGIT-ALWAYS
solution_steps_i18n:
  en-IN:
    canonical:
    - The shortcut of checking only the last digit does not work for 8.
    - Look at the number formed by the last three digits of {{n}} and divide that by 8; the remainder matches the remainder of {{n}} itself.
hints_i18n:
  en-IN:
  - The last-digit shortcut works for 2, 5 and 10 — but 8 needs more digits of the number examined.
  - Try dividing the last three digits of {{n}} by 8.
