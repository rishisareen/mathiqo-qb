# Class 6 servable coverage plan, U7. INT.CMP.ORDER: comparing a positive
# integer against a negative one. Ranges a in [1,4] and b in [-9,-5] are
# disjoint by construction (a is always positive, b always negative), so a is
# always greater with zero rejection. b's digit magnitude always exceeds a's,
# so the "b" distractor fits MISC.INT.BIGGER-ABS: picking the bigger-digit
# number as "bigger" while ignoring that it is negative.
template_id: TPL.INT.CMP.ORDER.NEGPOS.DIRECT.001
skill_ids:
