variables:
  a: { type: int, range: [1, 4] }
  b: { type: int, range: [-9, -5] }

constraints: []

stem_i18n:
  en-IN: "Which is bigger, {{a}} or {{b}}?"
localization_slots: []

answer: "a"

distractors:
  - expr: "b"
    misconception_id: MISC.INT.BIGGER-ABS

solution_steps_i18n:
  en-IN:
    canonical:
      - "{{a}} is a positive number and {{b}} is a negative number."
      - "Every positive number is greater than every negative number, no matter how the digits compare, so {{a}} is bigger."

hints_i18n:
  en-IN:
    - "Is one of these numbers positive and the other negative?"
    - "Any positive number is always greater than any negative number."

