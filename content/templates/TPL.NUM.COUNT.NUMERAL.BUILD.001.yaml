# Class 6 servable coverage plan, U4. NUM.COUNT: writing the numeral that
# matches a stated collection of hundreds/tens/ones (the "number as the
# size of a collection" half of the skill description).
template_id: TPL.NUM.COUNT.NUMERAL.BUILD.001
skill_ids:
  - NUM.COUNT
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: medium
estimated_time_sec: 35
calculator_allowed: false
diagram_required: false
context_tags:
  - school
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [1, 9] }
  b: { type: int, range: [0, 9] }
  c: { type: int, range: [0, 9] }

constraints: []

stem_i18n:
  en-IN: "A number is made up of {{a}} hundreds, {{b}} tens, and {{c}} ones. What is the number?"
localization_slots: []

answer: "100*a + 10*b + c"

distractors:
  - expr: "a + b + c"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Hundreds are worth 100 each: {{a}} x 100."
      - "Tens are worth 10 each: {{b}} x 10."
      - "Add the hundreds, tens, and ones together."

hints_i18n:
  en-IN:
    - "Each hundred is worth 100, not 1."
    - "Add the place values together, don't just add the digits."

