# Class 6 servable coverage, Implementation Unit U6: MEAS.AREA.FORMULA batch.
# Real-life tiling word problem combining the rectangle-area formula with a
# per-square-metre cost rate. Hard band, mcq_4.
template_id: TPL.MEAS.AREA.FORMULA.TILING.COST.001
template_version: "1.0.0"
