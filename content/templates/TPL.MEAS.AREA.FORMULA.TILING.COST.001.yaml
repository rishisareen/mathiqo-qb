variables:
  a: { type: int, range: [4, 10] }
  b: { type: int, range: [3, 9] }
  rate: { type: int, range: [20, 60] }

constraints: []

localization_slots: []
stem_i18n:
  en-IN: "A rectangular courtyard measuring {{a}} m by {{b}} m is to be tiled. Tiling costs Rs {{rate}} per square metre. What is the total cost of tiling the courtyard, in rupees?"

answer: "a * b * rate"

distractors:
  - expr: "(a + b) * rate"
    misconception_id: MISC.MEAS.AREA-ADD-SIDES
  - expr: "2 * (a + b) * rate"
    misconception_id: MISC.MEAS.PERIMETER-AREA-CONFUSED

solution_steps_i18n:
  en-IN:
    canonical:
      - "First find the courtyard's area: {{a}} x {{b}} square metres."
      - "Multiply the area by the cost per square metre, Rs {{rate}}, to get the total cost."

hints_i18n:
  en-IN:
    - "You need the area of the courtyard first — not its perimeter, and not the sum of its sides."
    - "Once you have the area, multiply it by the rate per square metre."

