constraints: []

localization_slots: []
stem_i18n:
  en-IN: "A bar graph shows rainy days per month, with each gridline worth {{k}} mm of rainfall: March reaches {{g1}} gridlines, April reaches {{g2}} gridlines, and May reaches {{g3}} gridlines. What is the combined rainfall shown for all three months?"

answer: "(g1 + g2 + g3) * k"

distractors:
  - expr: "g1 + g2 + g3"
    misconception_id: MISC.DATA.SCALE-IGNORED
  - expr: "(g1 + g2 + g3) * k - 1"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Add the gridlines across all three months: {{g1}} + {{g2}} + {{g3}}."
      - "Multiply that gridline total by the scale, {{k}}, to get the combined rainfall."

hints_i18n:
  en-IN:
    - "Add the gridline counts first, but each gridline is worth more than 1 mm."
    - "Once you have the total gridlines, multiply by the scale to get the actual total."

figure:
  - kind: bar-graph
    scale_expr: "k"
    unit: "mm"
    bars:
      - label_i18n:
          en-IN: "March"
        gridlines_expr: "g1"
      - label_i18n:
          en-IN: "April"
        gridlines_expr: "g2"
      - label_i18n:
          en-IN: "May"
        gridlines_expr: "g3"

