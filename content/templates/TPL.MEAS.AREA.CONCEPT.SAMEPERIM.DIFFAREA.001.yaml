# Class 6 servable coverage, Implementation Unit U6: MEAS.AREA.CONCEPT batch.
# Purpose-built to exercise MISC.MEAS.SAME-PERIMETER-SAME-AREA: two
# rectangles share a perimeter but differ in shape, so their areas differ too
# (a student who assumes equal perimeter means equal area would answer 0).
# Rectangle B is built from Rectangle A by transferring k cm from the width
# to the length (length a+k, width b-k), so a+b == (a+k)+(b-k) holds by
# construction — no equality constraint needed. Expanding, A's area minus
# B's area is k*(a-b+k), which is always positive since a > b and k >= 1 by
# range alone, so no ordering constraint is needed either — keeps rejection
# low (~kb<b bound only). Medium band, numeric_entry.
template_id: TPL.MEAS.AREA.CONCEPT.SAMEPERIM.DIFFAREA.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - MEAS.AREA.CONCEPT
question_type: numeric_entry
cognitive_level: conceptual
difficulty: 0.5
difficulty_prior: medium
estimated_time_sec: 60
calculator_allowed: false
diagram_required: false
context_tags:
  - school
  - puzzles

variables:
  a: { type: int, range: [6, 10] }
  b: { type: int, range: [2, 5] }
  k: { type: int, range: [1, 3] }

constraints:
  - "k < b"

localization_slots: []
stem_i18n:
  en-IN: "Rectangle A measures {{a}} cm by {{b}} cm. Rectangle B is made by adding {{k}} cm to Rectangle A's length and taking away {{k}} cm from its width, so Rectangle B measures ({{a}}+{{k}}) cm by ({{b}}-{{k}}) cm. Both rectangles therefore have exactly the same perimeter. By how many square centimetres is Rectangle A's area greater than Rectangle B's area?"

answer: "a*b - (a+k)*(b-k)"

distractors:
  - expr: "0"
    misconception_id: MISC.MEAS.SAME-PERIMETER-SAME-AREA
  - expr: "(a+k)*(b-k) - a*b"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Rectangle A's area is {{a}} x {{b}}, and Rectangle B's area is ({{a}}+{{k}}) x ({{b}}-{{k}})."
      - "Even though the perimeters match, the shapes are different, so the areas are different too: subtract to find the difference."

hints_i18n:
  en-IN:
    - "Equal perimeter does not mean equal area — work out each rectangle's area separately."
    - "Find Rectangle A's area and Rectangle B's area, then subtract the smaller from the larger."

tts: false
exam_contexts:
