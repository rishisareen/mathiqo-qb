# Authored 2026-07-29 (Class 6 servable coverage, Implementation Unit U5).
# NUM.PRIME — companion to TPL.NUM.PRIME.COUNTLIST.001, asking for the
# composite count in the same style of list instead of the prime count.
# Same curated list {{n}}, 1, 4, 9 (n in {2,3,5,7}): the composite count is
# always exactly 2 (just 4 and 9 — n is prime, 1 is neither), which
# specifically exercises "why 1 is neither prime nor composite" from this
# skill's description. Kept as a plain numeric_entry (no misconception
# distractors attached to this one — COUNTLIST.001 already carries both
# NUM.PRIME misconceptions) so the skill has >= 1 numeric_entry format.
