# U4 tier top-up (2026-07-29): FRAC.PARTWHOLE hard band. Extends the medium
# unequal-parts scenario (TPL.FRAC.PARTWHOLE.MEDIUM.001) by requiring the
# student to combine shaded small pieces AND the shaded large piece into one
# area-unit total, a genuinely deeper application of the same
# MISC.FRAC.UNEQUAL-PARTS misconception (naive piece-counting still ignores
# that the large piece is worth more than one unit).
template_id: TPL.FRAC.PARTWHOLE.HARD.001
skill_ids:
  - FRAC.PARTWHOLE
question_type: numeric_entry
cognitive_level: application
difficulty_prior: hard
difficulty: 0.8
estimated_time_sec: 60
calculator_allowed: false
diagram_required: true
accepted_answer_forms: simplest form only
context_tags:
  - shapes
exam_contexts:
  - SCHOOL_EXAM
variables:
  s:
    type: int
    range: [3, 6]
  k:
    type: int
    range: [2, 4]
  shaded_small:
    type: int
    range: [1, 3]
constraints:
  - "shaded_small < s"
localization_slots: []
stem_i18n:
  en-IN: "A garden bed is divided into {{s}} small equal-sized plots and 1 large plot that is exactly {{k}} times the size of a small plot, so the plots are NOT all the same size. {{shaded_small}} of the small plots AND the large plot are planted with flowers. What fraction of the garden bed's area is planted with flowers?"
answer: "simplify((shaded_small + k) / (s + k))"
distractors:
  - expr: "shaded_small / (s + k)"
    misconception_id: null
  - expr: "(shaded_small + 1) / (s + 1)"
    misconception_id: MISC.FRAC.UNEQUAL-PARTS
solution_steps_i18n:
  en-IN:
    canonical:
      - "Work in units the size of one small plot. The large plot is worth {{k}} of those units."
      - "Total units in the garden bed: {{s}} small-plot units + {{k}} units for the large plot."
      - "Planted units: {{shaded_small}} small plots ({{shaded_small}} units) plus the large plot ({{k}} units)."
      - "Fraction planted = planted units / total units, simplified."
hints_i18n:
  en-IN:
    - "Don't forget the large plot is also planted — add its area-units to the small plots' units."
    - "The large plot is worth {{k}} small-plot units, not just 1 unit like the others."
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
figure:
  # Same unequal split as the medium band, but here the large plot IS planted
  # along with shaded_small of the small ones -- forgetting it is exactly the
  # misconception this item tests, so the figure must show it shaded.
  - kind: region
    shape: rectangle
    parts:
      - weight_expr: "1"
        count_expr: "shaded_small"
        shaded: true
      - weight_expr: "1"
        count_expr: "s - shaded_small"
        shaded: false
      - weight_expr: "k"
        count_expr: "1"
        shaded: true
tts: false
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
