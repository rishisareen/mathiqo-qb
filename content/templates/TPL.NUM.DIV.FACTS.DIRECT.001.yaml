# Stage 2 authored 2026-07-29 (Class 6 servable coverage, Implementation Unit
# U4). Direct-computation numeric_entry drill: exact whole-number division
# (no remainder). "gcd(a, b) == b" is the divisibility test: true exactly
# when b divides a, using only whitelisted gcd + comparison — the cleanest
# way to guarantee an exact quotient without a floor/mod primitive (not
# whitelisted). This necessarily rejects most non-multiple combinations (most
# integers aren't multiples of a given divisor), matching the elevated
# constraint-rejection rate already accepted by the corpus's own reference
# template (TPL.FRAC.ADD.UNLIKE.WORD.001, 82% rejected, FLAGGED, promoted
# after review) — same tolerated pattern (KTD5), not a defect.
template_id: TPL.NUM.DIV.FACTS.DIRECT.001
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
skill_ids:
  - NUM.DIV
question_type: numeric_entry
cognitive_level: procedural
