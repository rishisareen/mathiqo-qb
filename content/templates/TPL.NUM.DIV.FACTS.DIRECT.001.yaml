difficulty_prior: easy
estimated_time_sec: 25
calculator_allowed: false
diagram_required: false
context_tags:
  - games
exam_contexts:
  - SCHOOL_EXAM

variables:
  a: { type: int, range: [12, 48] }
  b: { type: int, range: [2, 8] }

constraints:
  - "gcd(a, b) == b"
  - "a > b"

localization_slots: []
stem_i18n:
  en-IN: "What is {{a}} divided by {{b}}?"

answer: "a / b"

distractors: []

