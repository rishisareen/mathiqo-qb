    canonical:
      - "Find how many times {{b}} fits into {{a}} exactly."
      - "{{a}} / {{b}} is the number of equal groups."

hints_i18n:
  en-IN:
    - "Think of {{a}} as being split into groups of {{b}}."
    - "Use known multiplication facts for {{b}} to find the exact answer."

