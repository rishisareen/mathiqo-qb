# Class 6 servable coverage plan, U7. INT.CMP.ORDER: comparing two negative
# integers directly. Disjoint ranges (a in [-5,-1], b in [-9,-6]) guarantee
# a is always the one closer to zero (the true greater value) with zero
# rejection, while b always has the bigger digit magnitude, so the "b"
# distractor exactly reproduces MISC.INT.BIGGER-ABS ("-5 > -2 because 5 > 2").
template_id: TPL.INT.CMP.ORDER.NEGNEG.DIRECT.001
skill_ids:
