variables:
  a: { type: int, range: [-5, -1] }
  b: { type: int, range: [-9, -6] }

constraints: []

stem_i18n:
  en-IN: "Out of the two integers {{a}} and {{b}}, which one is bigger?"
localization_slots: []

answer: "a"

distractors:
  - expr: "b"
    misconception_id: MISC.INT.BIGGER-ABS

solution_steps_i18n:
  en-IN:
    canonical:
      - "On the number line, {{a}} sits closer to zero than {{b}} does."
      - "The integer closer to zero is the greater one, so {{a}} is greater even though its digit may look smaller."

hints_i18n:
  en-IN:
    - "Picture both numbers on the number line — which one sits further to the right?"
    - "For negative numbers, the one closer to zero is the greater one, even if it looks smaller by its digit."

