# Class 6 Servable Coverage plan, U4: MEAS.LENGTH.UNITS depth batch.
template_id: TPL.MEASLENGTH.RULER.READING.001
skill_ids:
  - MEAS.LENGTH.UNITS
question_type: numeric_entry
cognitive_level: procedural
difficulty_prior: easy
estimated_time_sec: 20
calculator_allowed: false
diagram_required: true
context_tags:
  - school

variables:
  a:
    type: int
    range: [0, 3]
  b:
    type: int
    range: [4, 12]
constraints:
  - "a < b"

stem_i18n:
  en-IN: "An eraser is placed against a ruler so that it starts exactly at the {{a}} cm mark and ends at the {{b}} cm mark. How long is the eraser, in centimetres?"
localization_slots: []

answer: "b - a"

distractors: []

solution_steps_i18n:
  en-IN:
    canonical:
      - "The length is the distance between where the eraser starts and where it ends."
      - "{{b}} - {{a}} = the eraser's length in cm."

hints_i18n:
  en-IN:
    - "Don't just read the end mark — check where the eraser actually starts too."
    - "Subtract the start mark from the end mark."

difficulty: 0.2
template_version: "1.0.0"
bank_version: "dev"
graph_version: "1.0.0"
figure:
  # A 15 cm ruler numbered every centimetre with half-centimetre ticks, and
  # the eraser laid from the a cm mark to the b cm mark. a is often not 0 --
  # that offset is the whole skill, so the object's start stays exactly
  # where the stem puts it. Neither mark is called a length: the reading is
  # the student's job.
  - kind: ruler
    min_expr: "0"
    max_expr: "15"
    major_expr: "1"
    minor_expr: "1/2"
    unit: "cm"
    objects:
      - label_i18n:
          en-IN: "Eraser"
        start_expr: "a"
        end_expr: "b"
tts: false
exam_contexts:
  - SCHOOL_EXAM
provenance:
  generator_version: "claude-agent/1.0"
  reviewer: "rishi"
  date: "2026-07-29"
