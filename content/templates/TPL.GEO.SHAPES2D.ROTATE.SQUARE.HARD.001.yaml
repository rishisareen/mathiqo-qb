# Class 6 Servable Coverage plan, U4: GEO.SHAPES.2D depth batch.
# Hard-band rotation item, narrative/named-character framing. Answer is the
# sides-plus-corners total (8), deliberately different from
# TPL.GEO.SHAPES2D.ROTATE.SQUARE.001's answer (4) so the two rotated-square
# items can't collide on the near-duplicate gate (U2) regardless of stem
# similarity — see that file's header for the numeric-proxy rationale.
template_id: TPL.GEO.SHAPES2D.ROTATE.SQUARE.HARD.001
skill_ids:
  - GEO.SHAPES.2D
question_type: mcq_4
cognitive_level: application
difficulty_prior: hard
estimated_time_sec: 45
calculator_allowed: false
diagram_required: true
context_tags:
  - objects
  - games

variables:
  n: { type: int, range: [1, 3] }
constraints: []

stem_i18n:
  en-IN: "{{name1}} draws a square with 4 equal sides and 4 right-angle corners, then spins the page {{n}} quarter-turns so the square balances on one of its corners like a spinning top. {{name2}} insists it isn't a square anymore, so its usual sides and corners no longer count. How many sides and corners does the shape actually have, added together?"
localization_slots:
  - name1
  - name2

answer: "4 + 4"

distractors:
  - expr: "0"
    misconception_id: MISC.GEO.ROTATED-NOT-SAME
  - expr: "4"
    misconception_id: null
  - expr: "6"
    misconception_id: null

solution_steps_i18n:
  en-IN:
    canonical:
      - "Spinning the page changes only how the square is oriented, not its sides or corners."
      - "It still has 4 sides and 4 corners no matter which way it's balanced, so {{name2}} is wrong: 4 + 4 = 8."

hints_i18n:
  en-IN:
    - "Did spinning the page change the number of sides or corners the shape has?"
    - "A shape's sides and corners depend on the shape itself, not which way up it's drawn."

difficulty: 0.8
