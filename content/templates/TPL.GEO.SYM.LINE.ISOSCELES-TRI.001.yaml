stem_i18n:
  en-IN: Triangle ABC has AB = AC = {{p}} cm and BC = {{q}} cm, with AB not
    equal to BC (so ABC is isosceles but not equilateral). How many lines of
    symmetry does it have?
answer: '1'
distractors:
- expr: '3'
  misconception_id: null
- expr: '0'
  misconception_id: null
- expr: '2'
  misconception_id: null
solution_steps_i18n:
  en-IN:
    canonical:
    - Triangle ABC has two equal sides (AB = AC) but its third side BC is
      different, so it is isosceles, not equilateral.
    - It has exactly one line of symmetry — the line from A to the midpoint of
      BC.
    - An equilateral triangle would have 3 lines of symmetry, but here the
      sides are not all equal, so only one fold line works.
hints_i18n:
  en-IN:
  - Which vertex sits between the two equal sides?
  - Only the fold line through that vertex and the midpoint of the opposite
    side makes the two halves match.
