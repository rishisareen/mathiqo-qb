# Patterns and sequences strand (NUMBER.PATTERNS) — Ganita Prakash Class 6
# Ch. 1 (Patterns in Mathematics) plus the Classes 1-5 patterning ladder.
# Stage 1 drafted 2026-07-27 via tools/stage1_draft.py (file backend),
# syllabus examples/ncert-patterns-excerpt.txt (illustrative, pending
# verification), accepted by graph_lint on first attempt, promoted after
# review. Virahanka/Fibonacci sequences are depth of NUM.PATTERN.EXTEND /
# NUM.PATTERN.FIGURATE, not their own node (§1.2a default-to-depth).
skills:
  - skill_id: NUM.PATTERN.EXTEND
    name: "Recognise and extend patterns"
    description: >
      Identify the rule of a repeating or growing pattern of shapes or
      numbers and extend it. Depth moves from repeating patterns to
      growing and reducing patterns and stated-rule sequences.
    strand: NUMBER.PATTERNS
    canonical_stage: 0
    prerequisites: []
    misconceptions:
      - MISC.NUM.PATTERN-CONSTANT-DIFF

  - skill_id: NUM.PARITY
    name: "Odd and even numbers"
    description: >
      Classify whole numbers as odd or even by pairing, and reason about
      the parity of sums at depth.
    strand: NUMBER.PATTERNS
    canonical_stage: 1
    prerequisites:
      - NUM.COUNT
    misconceptions:
      - MISC.NUM.ZERO-PARITY

  - skill_id: NUM.PATTERN.FIGURATE
    name: "Figurate number sequences"
    description: >
      Relate number sequences such as triangular, square and cube numbers
      to their pictorial arrangements, extend them, and explain why the
      pattern continues.
    strand: NUMBER.PATTERNS
    canonical_stage: 2
    prerequisites:
      - NUM.PATTERN.EXTEND
      - NUM.MULT.TABLES
    # Backfilled 2026-07-28: drafted in this run's misconceptions step, which
    # lints after the strand step, so the node list couldn't reference it yet.
    misconceptions:
      - MISC.NUM.SQUARE-DOUBLES


misconceptions:
  - misconception_id: MISC.NUM.PATTERN-CONSTANT-DIFF
    belief: "The next term always adds the same jump as the last one"
    signature_error: "1, 2, 4, 8, ... continued as 12 (adding the last difference of 4) instead of 16"
    remediation_target: NUM.PATTERN.EXTEND
    remediation_asset: "micro-explainers/MISC.NUM.PATTERN-CONSTANT-DIFF.v1"
    parent_summary_i18n:
      en-IN: "{{name}} extends every pattern by repeating the last jump, without first checking whether the jumps themselves are changing."
    child_feedback_i18n:
      en-IN: "You added 4 again because that was the last jump. But look at the jumps themselves — 1, 2, 4 — they're growing too, so the next jump should be 8, making the next term 16, not 12."

  - misconception_id: MISC.NUM.ZERO-PARITY
    belief: "Zero is neither even nor odd"
    signature_error: "Sorting numbers as odd or even, puts 0 in neither pile (0 is even)"
    remediation_target: NUM.PARITY
    remediation_asset: "micro-explainers/MISC.NUM.ZERO-PARITY.v1"
    parent_summary_i18n:
      en-IN: "{{name}} isn't sure whether zero is even or odd and tends to leave it out — zero is an even number."
    child_feedback_i18n:
      en-IN: "You left 0 out because you weren't sure which pile it belongs in. Zero splits into pairs with nothing left over — zero pairs — which makes it an even number."

  - misconception_id: MISC.NUM.SQUARE-DOUBLES
    belief: "Squaring a number means doubling it"
    signature_error: "The square numbers listed as 2, 4, 6, 8, ... (doubles) instead of 1, 4, 9, 16, ..."
    remediation_target: NUM.PATTERN.FIGURATE
    remediation_asset: "micro-explainers/MISC.NUM.SQUARE-DOUBLES.v1"
    parent_summary_i18n:
      en-IN: "{{name}} treats 'square of a number' as doubling it, rather than multiplying the number by itself — the picture of dots in a square helps here."
    child_feedback_i18n:
      en-IN: "You doubled each number instead of squaring it. Squaring a number means multiplying it by itself, so the square numbers are 1, 4, 9, 16 — not 2, 4, 6, 8."

