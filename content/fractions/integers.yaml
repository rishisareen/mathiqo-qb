# Integers strand (NUMBER.INTEGERS) — Ganita Prakash Class 6 Ch. 10 (The
# Other Side of Zero). Stage 1 drafted 2026-07-27 via tools/stage1_draft.py
# (file backend), syllabus examples/ncert-integers-excerpt.txt
# (illustrative, pending verification), accepted by graph_lint on first
# attempt, promoted after review. Integer multiplication/division is a
# later-grade concern and deliberately absent.
skills:
  - skill_id: INT.CONCEPT
    name: "Understand negative numbers"
    description: >
      Understand negative numbers as numbers on the other side of zero on
      the number line, arising in contexts such as temperatures below
      zero, floors below ground level and money owed; read and write
      integers with the minus sign.
    strand: NUMBER.INTEGERS
    canonical_stage: 1
    prerequisites:
      - NUM.CMP.ORDER
    misconceptions: []

  - skill_id: INT.CMP.ORDER
    name: "Compare and order integers"
    description: >
      Compare and order integers, including negatives, using their
      positions on the number line.
    strand: NUMBER.INTEGERS
    canonical_stage: 2
    prerequisites:
      - INT.CONCEPT
    misconceptions:
      - MISC.INT.BIGGER-ABS

  - skill_id: INT.ADD.SUB
    name: "Add and subtract integers"
    description: >
      Add and subtract integers using the number-line and token
      (positive/negative counter) models.
    strand: NUMBER.INTEGERS
    canonical_stage: 3
    prerequisites:
      - INT.CONCEPT
      - NUM.ADD.SUB
    misconceptions:
      - MISC.INT.IGNORE-SIGNS


misconceptions:
  - misconception_id: MISC.INT.BIGGER-ABS
    belief: "The integer with the bigger digits is the bigger number, sign or no sign"
    signature_error: "-5 > -2 because 5 > 2"
    remediation_target: INT.CONCEPT
    remediation_asset: "micro-explainers/MISC.INT.BIGGER-ABS.v1"
    parent_summary_i18n:
      en-IN: "{{name}} compares negative numbers by their size alone — on the number line, -5 is actually further below zero than -2, so it is smaller."
    child_feedback_i18n:
      en-IN: "You compared -5 and -2 by their digits, but on the number line -5 sits further below zero than -2 does — so -5 is actually the smaller number."

  - misconception_id: MISC.INT.IGNORE-SIGNS
    belief: "Add the digits first, sort out the sign later (or not at all)"
    signature_error: "-3 + 5 = 8 (added 3 and 5, dropped the signs)"
    remediation_target: INT.CONCEPT
    remediation_asset: "micro-explainers/MISC.INT.IGNORE-SIGNS.v1"
    parent_summary_i18n:
      en-IN: "{{name}} adds the numbers as if both were positive and handles the minus sign afterwards, instead of treating -3 as three steps below zero."
    child_feedback_i18n:
      en-IN: "You added 3 and 5 and sorted out the sign afterwards, which is how you got 8. Try starting three steps below zero (-3) and moving 5 steps up instead — that lands on 2, not 8."

  - misconception_id: MISC.INT.SUB-MAKES-SMALLER
    belief: "Subtracting always makes a number smaller"
    signature_error: "5 - (-2) = 3 (expected subtraction to reduce, so treated -2 as 2)"
    remediation_target: INT.CONCEPT
    remediation_asset: "micro-explainers/MISC.INT.SUB-MAKES-SMALLER.v1"
    parent_summary_i18n:
      en-IN: "{{name}} expects subtraction to always make the answer smaller — subtracting a negative number actually moves the answer up the number line."
    child_feedback_i18n:
      en-IN: "You expected subtracting to make the number smaller, so you treated -2 like it was 2. But subtracting a negative number moves you up the number line — 5 - (-2) is really 5 + 2 = 7."

