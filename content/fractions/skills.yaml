# The v1 fractions cluster — 10 nodes transcribed from the core design doc §1.3.
# Prerequisite edges follow the §1.3 mermaid diagram exactly.
# NOTE: §1.2's worked-example YAML for FRAC.ADD.UNLIKE lists only three
# prerequisites (EQUIV, ADD.LIKE, LCM), but the §1.3 diagram additionally shows
# SIMPLIFY --> ADDUNLIKE. We follow the diagram here; flagged for reconciliation
# with the doc authors.
skills:
  - skill_id: FRAC.ADD.UNLIKE
    name: "Add and subtract fractions with unlike denominators"
    description: >
      Add or subtract two proper fractions a/b, c/d where b != d,
      expressing the result in simplest form. Named "Add..." in the core
      doc's §1.2 worked-example YAML, but the §1.3 diagram labels this node
      "Add/subtract" — matching its sibling FRAC.ADD.LIKE, which already
      covers both operations. We follow the diagram + sibling precedent here.
    strand: NUMBER.FRACTIONS
    canonical_stage: 3
    prerequisites:
      - FRAC.EQUIV       # equivalent fractions
      - FRAC.ADD.LIKE    # add with like denominators
      - NUM.LCM          # lowest common multiple
      - FRAC.SIMPLIFY    # §1.3 mermaid edge (see note above)
    misconceptions:
      - MISC.FRAC.ADD-ACROSS
      - MISC.FRAC.FIRST-DENOM
      - MISC.FRAC.NO-SIMPLIFY

  - skill_id: FRAC.UNIT
    name: "Understand unit fractions"
    description: >
      Recognise and reason about unit fractions (1/2, 1/3, 1/4 ...)
      as one part of an equally divided whole.
    strand: NUMBER.FRACTIONS
    canonical_stage: 1
    prerequisites: []
    misconceptions:
      - MISC.FRAC.BIGGER-DENOM

  - skill_id: FRAC.PARTWHOLE
    name: "Fraction of a shape or set"
    description: >
      Identify and represent a fraction of a shape or of a set of objects.
    strand: NUMBER.FRACTIONS
    canonical_stage: 2
    prerequisites:
      - FRAC.UNIT
    # MISC.FRAC.UNEQUAL-PARTS added 2026-07-27 (Stage 1 draft): diagnosed
    # here, not just remediated here — unlike MISC.FRAC.MULT-MAKES-BIGGER
    # (also remediation_target: FRAC.PARTWHOLE, but diagnosed one skill up
    # at FRAC.MULT.FRAC), this misconception IS about FRAC.PARTWHOLE's own
    # core procedure.
    misconceptions:
      - MISC.FRAC.UNEQUAL-PARTS

  - skill_id: FRAC.EQUIV
    name: "Equivalent fractions"
    description: >
      Generate and recognise equivalent fractions (1/2 = 2/4 = 3/6).
    strand: NUMBER.FRACTIONS
    canonical_stage: 2
    prerequisites:
      - FRAC.PARTWHOLE
      - NUM.MULT.TABLES
    # MISC.FRAC.EQUIV-ADD-SAME added 2026-07-27 (Stage 1 draft), same
    # diagnosed-here reasoning as FRAC.PARTWHOLE above.
    misconceptions:
      - MISC.FRAC.EQUIV-ADD-SAME

  - skill_id: FRAC.CMP
    name: "Compare and order fractions"
    description: >
      Compare two fractions and order sets of fractions by size.
    strand: NUMBER.FRACTIONS
    canonical_stage: 3
    prerequisites:
      - FRAC.EQUIV
    misconceptions:
      - MISC.FRAC.BIGGER-DENOM

  - skill_id: FRAC.SIMPLIFY
    name: "Reduce to simplest form"
    description: >
      Reduce a fraction to simplest (lowest) form by dividing numerator
      and denominator by their greatest common divisor.
    strand: NUMBER.FRACTIONS
    canonical_stage: 3
    prerequisites:
      - FRAC.EQUIV
    misconceptions:
      - MISC.FRAC.NO-SIMPLIFY

  - skill_id: FRAC.ADD.LIKE
    name: "Add and subtract fractions with like denominators"
    description: >
      Add or subtract two fractions that share a denominator by
      combining the numerators.
    strand: NUMBER.FRACTIONS
    canonical_stage: 3
    prerequisites:
      - FRAC.PARTWHOLE
    misconceptions: []

  - skill_id: NUM.LCM
    name: "Lowest common multiple"
    description: >
      Find the lowest common multiple of two small whole numbers.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 2
    prerequisites:
      - NUM.MULT.TABLES
    # MISC.NUM.LCM-CONFUSED-WITH-GCF added 2026-07-27 (Stage 1 draft):
    # diagnosed here (own core procedure).
    misconceptions:
      - MISC.NUM.LCM-CONFUSED-WITH-GCF

  - skill_id: FRAC.MIXED.ADD
    name: "Add and subtract mixed numbers"
    description: >
      Add or subtract mixed numbers, converting between mixed and
      improper forms as needed.
    strand: NUMBER.FRACTIONS
    canonical_stage: 4
    prerequisites:
      - FRAC.ADD.UNLIKE
    # MISC.FRAC.MIXED-NO-REGROUP added 2026-07-27 (Stage 1 draft):
    # diagnosed here (own core procedure).
    misconceptions:
      - MISC.FRAC.MIXED-NO-REGROUP

  - skill_id: NUM.MULT.TABLES
    name: "Multiplication facts"
    description: >
      Fluent recall of multiplication table facts.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 1
    prerequisites: []
    # MISC.NUM.MULT.TABLES.REPEATED-ADD-OFFBYONE added 2026-07-29 (Class 6
    # Servable Coverage plan, U3): diagnosed here (own core procedure);
    # registered in misconceptions.yaml, following this file's existing
    # convention of registering its own nodes' misconceptions there (see
    # MISC.NUM.LCM-CONFUSED-WITH-GCF, MISC.FRAC.MIXED-NO-REGROUP).
    misconceptions:
      - MISC.NUM.MULT.TABLES.REPEATED-ADD-OFFBYONE

  # --- Stage 1 drafted 2026-07-27 via tools/stage1_draft.py, syllabus
  # examples/ncert-fractions-excerpt.txt (illustrative, not a real NCERT
  # transcription), promoted after review; see staging manifest for
  # provenance (prompt hash, accepted-at, lint output).
  - skill_id: FRAC.MULT.WHOLE
    name: "Multiply a fraction by a whole number"
    description: >
      Multiply a proper fraction by a whole number (e.g. 2/5 x 3),
      interpreting the product as repeated addition of the fraction,
      expressing the result in simplest form.
    strand: NUMBER.FRACTIONS
    canonical_stage: 3
    prerequisites:
      - FRAC.PARTWHOLE
      - NUM.MULT.TABLES
    misconceptions:
      - MISC.FRAC.MULT-WHOLE-BOTH

  - skill_id: FRAC.MULT.FRAC
    name: "Multiply a fraction by a fraction"
    description: >
      Multiply two proper fractions (e.g. 1/2 x 1/3), interpreting the
      product as "a fraction of a fraction" via the area model, expressing
      the result in simplest form.
    strand: NUMBER.FRACTIONS
    canonical_stage: 4
    prerequisites:
      - FRAC.MULT.WHOLE
    misconceptions:
      - MISC.FRAC.MULT-MAKES-BIGGER

  # --- Stage 1 drafted 2026-07-27 via tools/stage1_draft.py (second batch),
  # syllabus examples/ncert-fractions-excerpt.txt, promoted after review.
  - skill_id: FRAC.DIV.WHOLE
    name: "Divide a fraction by a whole number"
    description: >
      Divide a proper fraction by a whole number (e.g. 2/5 / 3), interpreting
      the result as splitting the fraction into equal parts, expressing the
      result in simplest form.
    strand: NUMBER.FRACTIONS
    canonical_stage: 3
    prerequisites:
      - FRAC.MULT.WHOLE
    misconceptions:
      - MISC.FRAC.DIV-WHOLE-MULTIPLY

  - skill_id: FRAC.DIV.FRAC
    name: "Divide a fraction by a fraction"
    description: >
      Divide a proper fraction by another proper fraction (e.g. 1/2 / 1/3)
      using the reciprocal-and-multiply method, expressing the result in
      simplest form.
    strand: NUMBER.FRACTIONS
    canonical_stage: 4
    prerequisites:
      - FRAC.DIV.WHOLE
      - FRAC.MULT.FRAC
    misconceptions:
      - MISC.FRAC.DIV-WRONG-FLIP
