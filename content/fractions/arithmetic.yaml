# Whole-number arithmetic strand (NUMBER.ARITHMETIC) — backward closure for
# the Class 6 map plus the Class 6 Number Play treatment. Stage 1 drafted
# 2026-07-27 via tools/stage1_draft.py (file backend), syllabus
# examples/ncert-arithmetic-excerpt.txt, accepted by graph_lint on first
# attempt and promoted after review; the Class 6 (Ch. 3) chapter reference
# was verified against the published Ganita Prakash 6 table of contents
# (Class 6 Servable Coverage plan, U1). Extends the existing NUM.MULT.TABLES /
# NUM.LCM nodes in skills.yaml; misconception and mapping sections follow
# the skills, all three drafted in the same run.
skills:
  - skill_id: NUM.COUNT
    name: "Count and read whole numbers"
    description: >
      Count collections of objects and read and write the matching
      numerals, understanding a number as the size of a collection.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 0
    prerequisites: []
    misconceptions: []

  - skill_id: NUM.PLACE.VALUE
    name: "Place value of whole numbers"
    description: >
      Understand the value of a digit by its place (ones, tens, hundreds,
      ...), read and write numbers in standard and expanded form. Depth
      extends the number range (two-digit through large numbers with
      Indian grouping) and digit puzzles on place structure.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 1
    prerequisites:
      - NUM.COUNT
    misconceptions:
      - MISC.NUM.PLACE-FACE-VALUE
      - MISC.NUM.ZERO-PLACEHOLDER

  - skill_id: NUM.CMP.ORDER
    name: "Compare and order whole numbers"
    description: >
      Compare two whole numbers and order a set of whole numbers by size
      using place-value reasoning.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 2
    prerequisites:
      - NUM.PLACE.VALUE
    misconceptions:
      - MISC.NUM.FIRST-DIGIT-CMP

  - skill_id: NUM.ADD.SUB
    name: "Add and subtract whole numbers"
    description: >
      Add and subtract whole numbers, with regrouping (carrying and
      borrowing) at depth. Depth extends the number range and the number
      of regroupings required.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 2
    prerequisites:
      - NUM.COUNT
      - NUM.PLACE.VALUE
    misconceptions:
      - MISC.NUM.SUB-SMALLER-FROM-LARGER
      - MISC.NUM.ADD-NO-CARRY

  - skill_id: NUM.MULT
    name: "Multiply whole numbers"
    description: >
      Multiply whole numbers beyond known facts using the standard
      procedure built on place value and repeated addition (e.g. a
      two-digit by a one-digit number; larger factors at depth).
    strand: NUMBER.ARITHMETIC
    canonical_stage: 3
    prerequisites:
      - NUM.MULT.TABLES
      - NUM.PLACE.VALUE
      - NUM.ADD.SUB
    misconceptions: []

  - skill_id: NUM.DIV
    name: "Divide whole numbers"
    description: >
      Divide whole numbers using equal grouping and sharing, interpreting
      and reporting remainders; longer dividends at depth.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 3
    prerequisites:
      - NUM.MULT.TABLES
      - NUM.PLACE.VALUE
    misconceptions:
      - MISC.NUM.DIV-REMAINDER-DROPPED

  - skill_id: NUM.ESTIMATE
    name: "Round and estimate"
    description: >
      Round whole numbers to a given place and estimate the result of an
      operation before computing, judging whether an answer is reasonable.
    strand: NUMBER.ARITHMETIC
    canonical_stage: 4
    prerequisites:
      - NUM.PLACE.VALUE
      - NUM.CMP.ORDER
    misconceptions:
      - MISC.NUM.ROUND-TRUNCATE


# Registry entries: the node-referenced entries drafted inline with the
# strand, plus the misconceptions-step additions.
misconceptions:
  - misconception_id: MISC.NUM.PLACE-FACE-VALUE
    belief: "A digit is worth its face value wherever it stands"
    signature_error: "In 47, the 4 is worth 4 (instead of 40)"
    remediation_target: NUM.PLACE.VALUE
    remediation_asset: "micro-explainers/MISC.NUM.PLACE-FACE-VALUE.v1"
    parent_summary_i18n:
      en-IN: "{{name}} reads each digit on its own and doesn't yet use what the digit is worth in its place — the 4 in 47 stands for 40, not 4."
    child_feedback_i18n:
      en-IN: "You read the 4 in 47 as just '4', but its place changes its value. In the tens place, that 4 is really worth 40."

  - misconception_id: MISC.NUM.ZERO-PLACEHOLDER
    belief: "Zero in the middle of a number can be skipped when writing it"
    signature_error: "Writes 'three hundred five' as 35 instead of 305"
    remediation_target: NUM.PLACE.VALUE
    remediation_asset: "micro-explainers/MISC.NUM.ZERO-PLACEHOLDER.v1"
    parent_summary_i18n:
      en-IN: "{{name}} sometimes drops the zero when writing numbers like 305, not yet seeing that the zero holds the tens place."
    child_feedback_i18n:
      en-IN: "You left out the zero, but every place needs a digit. 'Three hundred five' has nothing in the tens place, so it needs a 0 there — that's 305, not 35."

  - misconception_id: MISC.NUM.FIRST-DIGIT-CMP
    belief: "The number whose first digit is bigger is the bigger number"
    signature_error: "91 > 234 because 9 > 2"
    remediation_target: NUM.PLACE.VALUE
    remediation_asset: "micro-explainers/MISC.NUM.FIRST-DIGIT-CMP.v1"
    parent_summary_i18n:
      en-IN: "{{name}} compares numbers by their first digits without first checking how many digits each number has."
    child_feedback_i18n:
      en-IN: "You compared 91 and 234 by their first digits, but 234 has three digits and 91 only has two. A number with more digits is bigger, so check the number of digits before comparing digit by digit."

  - misconception_id: MISC.NUM.SUB-SMALLER-FROM-LARGER
    belief: "In each column, always take the smaller digit away from the larger one"
    signature_error: "52 - 38 = 26 (computed 8 - 2 in the ones column instead of borrowing)"
    remediation_target: NUM.PLACE.VALUE
    remediation_asset: "micro-explainers/MISC.NUM.SUB-SMALLER-FROM-LARGER.v1"
    parent_summary_i18n:
      en-IN: "{{name}} subtracts the smaller digit from the larger one in each column, instead of borrowing when the top digit is smaller."
    child_feedback_i18n:
      en-IN: "In the ones column you took 2 away from 8 instead of borrowing, since 2 was the smaller digit on top. When the top digit is smaller than the one you're subtracting, borrow a ten from the next column first."

  - misconception_id: MISC.NUM.ADD-NO-CARRY
    belief: "Write the whole column sum down; nothing moves to the next column"
    signature_error: "47 + 38 = 715 (wrote 15 in the ones column instead of carrying)"
    remediation_target: NUM.PLACE.VALUE
    remediation_asset: "micro-explainers/MISC.NUM.ADD-NO-CARRY.v1"
    parent_summary_i18n:
      en-IN: "{{name}} adds each column correctly but writes the full sum in place, instead of carrying tens over to the next column."
    child_feedback_i18n:
      en-IN: "You wrote the whole ones-column sum (15) straight down instead of carrying. When a column adds to 10 or more, write down just the ones digit and carry the tens digit over to the next column."

  - misconception_id: MISC.NUM.DIV-REMAINDER-DROPPED
    belief: "The answer to a division is just the quotient; anything left over can be ignored"
    signature_error: "17 / 5 = 3 with the remainder 2 silently dropped, even where the problem asks about it"
    remediation_target: NUM.DIV
    remediation_asset: "micro-explainers/MISC.NUM.DIV-REMAINDER-DROPPED.v1"
    parent_summary_i18n:
      en-IN: "{{name}} divides correctly but tends to ignore the remainder, even when the question depends on what is left over."
    child_feedback_i18n:
      en-IN: "You found the quotient but dropped the remainder. Check what the question is actually asking — sometimes the leftover amount is exactly the answer it wants."

  - misconception_id: MISC.NUM.ROUND-TRUNCATE
    belief: "Rounding means cutting the number off at the place asked for"
    signature_error: "78 rounded to the nearest ten given as 70 (always rounds down)"
    remediation_target: NUM.ESTIMATE
    remediation_asset: "micro-explainers/MISC.NUM.ROUND-TRUNCATE.v1"
    parent_summary_i18n:
      en-IN: "{{name}} rounds numbers by simply chopping off digits, always rounding down instead of checking which ten (or hundred) is nearer."
    child_feedback_i18n:
      en-IN: "You rounded 78 down to 70 by chopping off the last digit. Rounding means checking which ten is nearer — 78 is closer to 80, so it should round up, not down."

  - misconception_id: MISC.NUM.DIV-SMALLER-BY-LARGER
    belief: "You cannot divide a smaller number by a larger one"
    signature_error: "Asked to share 3 rotis among 4 people, answers 'can't be done' (or silently computes 4 / 3 instead)"
    remediation_target: NUM.DIV
    remediation_asset: "micro-explainers/MISC.NUM.DIV-SMALLER-BY-LARGER.v1"
    parent_summary_i18n:
      en-IN: "{{name}} believes a smaller number can't be divided by a bigger one, and flips the numbers around when a problem needs it."
    child_feedback_i18n:
      en-IN: "You said it couldn't be done because 3 is smaller than 4, but a smaller number can always be divided by a larger one — sharing 3 rotis among 4 people just means each person gets less than one whole roti."

