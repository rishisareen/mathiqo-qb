# Constructions strand (GEOMETRY.CONSTRUCT) — Ganita Prakash Class 6 Ch. 8
# (Playing with Constructions). Stage 1 drafted 2026-07-28 via
# tools/stage1_draft.py (file backend), syllabus
# examples/ncert-geometry-excerpt.txt, accepted by graph_lint on first
# attempt, promoted after review; the Ch. 8 chapter reference was verified
# against the published Ganita Prakash 6 table of contents (Class 6
# Servable Coverage plan, U1).
skills:
  - skill_id: GEO.CIRCLE.PARTS
    name: "Circles: centre, radius and diameter"
    description: >
      Identify the centre, radius and diameter of a circle, relate radius
      and diameter, and draw a circle of a given radius with a compass.
    strand: GEOMETRY.CONSTRUCT
    canonical_stage: 2
    prerequisites:
      - GEO.SHAPES.2D
    misconceptions:
      - MISC.GEO.RADIUS-DIAMETER-SWAP

  - skill_id: GEO.CONSTRUCT.BASIC
    name: "Construct figures with ruler and compass"
    description: >
      Construct squares and rectangles of given side lengths, and figures
      and patterns built from circles and line segments, using a ruler
      and compass.
    strand: GEOMETRY.CONSTRUCT
    canonical_stage: 3
    prerequisites:
      - GEO.POINT.LINE
      - GEO.CIRCLE.PARTS
      - GEO.POLYGON.PROPS
    # MISC.GEO.CONSTRUCT.COMPASS-SLIP added 2026-07-29 (Class 6 Servable
    # Coverage plan, U3): diagnosed here (own core procedure).
    misconceptions:
      - MISC.GEO.CONSTRUCT.COMPASS-SLIP


misconceptions:
  - misconception_id: MISC.GEO.CONSTRUCT.COMPASS-SLIP
    belief: "The compass opening doesn't need to stay fixed while marking off equal lengths"
    signature_error: "Constructing a square of side 4 cm by walking the compass around to mark each side, the opening drifts between arcs, so the four sides come out as 4 cm, 4.3 cm, 3.6 cm and 4 cm instead of all equal"
    remediation_target: GEO.CONSTRUCT.BASIC
    remediation_asset: "micro-explainers/MISC.GEO.CONSTRUCT.COMPASS-SLIP.v1"
    parent_summary_i18n:
      en-IN: "{{name}}'s compass opening sometimes shifts partway through a construction, so sides meant to be equal come out slightly different lengths — locking the screw and checking the opening against the ruler before each arc fixes this."
    child_feedback_i18n:
      en-IN: "Your sides came out different lengths because the compass opening moved between arcs. Once you set the compass to a length, don't touch the opening again until you're done — check it against your ruler before you start."

  - misconception_id: MISC.GEO.RADIUS-DIAMETER-SWAP
    belief: "Radius and diameter are interchangeable names for the width of a circle"
    signature_error: "Asked to draw a circle of radius 4 cm, sets the compass to 8 cm (or reports the diameter when asked for the radius)"
    remediation_target: GEO.CIRCLE.PARTS
    remediation_asset: "micro-explainers/MISC.GEO.RADIUS-DIAMETER-SWAP.v1"
    parent_summary_i18n:
      en-IN: "{{name}} mixes up radius and diameter — the radius reaches from the centre to the circle, and the diameter goes all the way across."
    child_feedback_i18n:
      en-IN: "You set the compass to 8 cm, the diameter, instead of the radius. The radius goes from the centre to the edge; the diameter goes all the way across, so it's always twice the radius."

  - misconception_id: MISC.GEO.CENTRE-ON-CIRCLE
    belief: "The centre is part of the circle"
    signature_error: "Asked which points lie on the circle, includes the centre"
    remediation_target: GEO.CIRCLE.PARTS
    remediation_asset: "micro-explainers/MISC.GEO.CENTRE-ON-CIRCLE.v1"
    parent_summary_i18n:
      en-IN: "{{name}} counts the centre as lying on the circle — the circle is only the ring of points at the same distance from the centre."
    child_feedback_i18n:
      en-IN: "You counted the centre as a point on the circle. But the circle is only the ring of points the same distance from the centre — the centre itself sits inside it, not on it."

