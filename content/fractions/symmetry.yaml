# Symmetry strand (GEOMETRY.SYMMETRY) — Ganita Prakash Class 6 Ch. 9
# (Symmetry) with the Classes 4-5 Maths Mela symmetry ladder. Stage 1
# drafted 2026-07-28 via tools/stage1_draft.py (file backend), syllabus
# examples/ncert-geometry-excerpt.txt (illustrative, pending verification),
# accepted by graph_lint on first attempt, promoted after review.
# GEO.SYM.ROTATIONAL takes GEO.ANGLE.CONCEPT (turns), not GEO.SYM.LINE:
# reflection is not conceptual apparatus for rotation.
skills:
  - skill_id: GEO.SYM.LINE
    name: "Line symmetry"
    description: >
      Identify lines of symmetry in 2-D figures, including figures with
      several lines of symmetry, and complete a figure given half of it
      and the mirror line.
    strand: GEOMETRY.SYMMETRY
    canonical_stage: 2
    prerequisites:
      - GEO.SHAPES.2D
    misconceptions:
      - MISC.GEO.RECT-DIAGONAL-SYM

  - skill_id: GEO.SYM.ROTATIONAL
    name: "Rotational symmetry"
    description: >
      Recognise rotational symmetry in a figure and find its order — the
      number of positions in a full turn where the figure looks the same.
    strand: GEOMETRY.SYMMETRY
    canonical_stage: 3
    prerequisites:
      - GEO.SHAPES.2D
      - GEO.ANGLE.CONCEPT
    misconceptions: []


misconceptions:
  - misconception_id: MISC.GEO.RECT-DIAGONAL-SYM
    belief: "The diagonal of a rectangle is a line of symmetry"
    signature_error: "Draws the diagonals of a (non-square) rectangle as its lines of symmetry"
    remediation_target: GEO.SYM.LINE
    remediation_asset: "micro-explainers/MISC.GEO.RECT-DIAGONAL-SYM.v1"
    parent_summary_i18n:
      en-IN: "{{name}} draws diagonals as fold lines of a rectangle — folding along a diagonal doesn't make the halves match; paper folding shows why."
    child_feedback_i18n:
      en-IN: "You drew the diagonal as a fold line, but folding a rectangle (that isn't a square) along its diagonal doesn't make the two halves land on top of each other. Try folding one on paper to see why the diagonal doesn't work."

  - misconception_id: MISC.GEO.PARALLELOGRAM-LINE-SYM
    belief: "A parallelogram has line symmetry because its halves look alike"
    signature_error: "Claims a (non-rectangular) parallelogram has two lines of symmetry through its diagonals"
    remediation_target: GEO.SYM.LINE
    remediation_asset: "micro-explainers/MISC.GEO.PARALLELOGRAM-LINE-SYM.v1"
    parent_summary_i18n:
      en-IN: "{{name}} sees the matching halves of a parallelogram as mirror halves — they match by turning, not by folding, so a slanted parallelogram has no fold line."
    child_feedback_i18n:
      en-IN: "The two halves of a parallelogram do match, but only when you turn the shape, not when you fold it — that's rotational symmetry, not line symmetry. A slanted parallelogram has no fold line that makes it match itself."

