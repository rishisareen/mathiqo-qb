# Misconception registry entries for the fractions cluster, transcribed from
# the core design doc §2.4 (registry table) with the two product-facing fields
# §2.4 requires: remediation_asset and parent_summary_i18n.
misconceptions:
  - misconception_id: MISC.FRAC.ADD-ACROSS
    belief: "Add tops, add bottoms"
    signature_error: "1/2 + 1/3 = 2/5"
    remediation_target: FRAC.EQUIV   # child doesn't see fractions as quantities
    remediation_asset: "micro-explainers/MISC.FRAC.ADD-ACROSS.v1"
    parent_summary_i18n:
      en-IN: "{{name}} understands adding fractions, but tends to add the denominators when they don't match."

  - misconception_id: MISC.FRAC.FIRST-DENOM
    belief: "Keep the first denominator"
    signature_error: "1/2 + 1/3 = 2/2"
    remediation_target: FRAC.ADD.LIKE   # why like denominators are required
    remediation_asset: "micro-explainers/MISC.FRAC.FIRST-DENOM.v1"
    parent_summary_i18n:
      en-IN: "{{name}} adds the numerators correctly, but keeps the first denominator instead of finding a common one."

  - misconception_id: MISC.FRAC.NO-SIMPLIFY
    belief: "Answer complete without reducing"
    signature_error: "1/4 + 1/4 = 2/8"
    remediation_target: FRAC.SIMPLIFY
    remediation_asset: "micro-explainers/MISC.FRAC.NO-SIMPLIFY.v1"
    parent_summary_i18n:
      en-IN: "{{name}} can add the fractions, but often forgets to write the answer in simplest form."

  - misconception_id: MISC.FRAC.BIGGER-DENOM
    belief: "Bigger denominator = bigger fraction"
    signature_error: "1/8 > 1/4 because 8 > 4"
    remediation_target: FRAC.UNIT   # meaning of the denominator
    remediation_asset: "micro-explainers/MISC.FRAC.BIGGER-DENOM.v1"
    parent_summary_i18n:
      en-IN: "{{name}} thinks a bigger bottom number means a bigger fraction — a larger denominator actually means smaller pieces."

  # --- Stage 1 drafted 2026-07-27 via tools/stage1_draft.py; see skills.yaml
  # for the same provenance note. MULT-WHOLE-BOTH and MULT-MAKES-BIGGER were
  # drafted alongside the FRAC.MULT.* skills that reference them; EQUIV-ADD-
  # SAME and UNEQUAL-PARTS backfill misconception coverage for FRAC.EQUIV and
  # FRAC.PARTWHOLE, which previously had none.
  - misconception_id: MISC.FRAC.MULT-WHOLE-BOTH
    belief: "Multiply top and bottom by the whole number"
    signature_error: "3 x 1/2 = 3/6 = 1/2 (value unchanged)"
    remediation_target: FRAC.MULT.WHOLE
    remediation_asset: "micro-explainers/MISC.FRAC.MULT-WHOLE-BOTH.v1"
    parent_summary_i18n:
      en-IN: "{{name}} multiplies both the top and bottom of the fraction by the whole number, so the value does not change."

  - misconception_id: MISC.FRAC.MULT-MAKES-BIGGER
    belief: "Multiplying always makes a number bigger"
    signature_error: "1/2 x 1/3 is expected to be bigger than 1/2 (e.g. answered 5/6 instead of 1/6)"
    remediation_target: FRAC.PARTWHOLE
    remediation_asset: "micro-explainers/MISC.FRAC.MULT-MAKES-BIGGER.v1"
    parent_summary_i18n:
      en-IN: "{{name}} can multiply fractions correctly, but expects the answer to always be bigger, the way multiplying whole numbers grows the result."

  - misconception_id: MISC.FRAC.EQUIV-ADD-SAME
    belief: "Add the same number to top and bottom to get an equivalent fraction"
    signature_error: "1/2 = 2/3 (added 1 to both the numerator and denominator)"
    remediation_target: FRAC.EQUIV
    remediation_asset: "micro-explainers/MISC.FRAC.EQUIV-ADD-SAME.v1"
    parent_summary_i18n:
      en-IN: "{{name}} tries to find equivalent fractions by adding the same number to the top and bottom, rather than multiplying both by the same factor."

  - misconception_id: MISC.FRAC.UNEQUAL-PARTS
    belief: "Any division into pieces counts as fraction parts, whether or not they are equal size"
    signature_error: "A shape split into one big piece and two small pieces, with one small piece shaded, is read as 1/3"
    remediation_target: FRAC.PARTWHOLE
    remediation_asset: "micro-explainers/MISC.FRAC.UNEQUAL-PARTS.v1"
    parent_summary_i18n:
      en-IN: "{{name}} identifies fractions from a shape even when the parts aren't equal-sized, which changes what fraction is actually shown."

  # --- Stage 1 drafted 2026-07-27 via tools/stage1_draft.py (second batch),
  # covering the FRAC.DIV.* skills plus a backfill for NUM.LCM and
  # FRAC.MIXED.ADD, which previously had none.
  - misconception_id: MISC.FRAC.DIV-WHOLE-MULTIPLY
    belief: "Dividing a fraction by a whole number means multiplying instead"
    signature_error: "2/5 / 3 = 6/5 (multiplied the numerator by 3 instead of the denominator)"
    remediation_target: FRAC.DIV.WHOLE
    remediation_asset: "micro-explainers/MISC.FRAC.DIV-WHOLE-MULTIPLY.v1"
    parent_summary_i18n:
      en-IN: "{{name}} sometimes multiplies instead of dividing when dividing a fraction by a whole number."

  - misconception_id: MISC.FRAC.DIV-WRONG-FLIP
    belief: "Flip the first fraction instead of the second when dividing"
    signature_error: "1/2 / 1/3 computed as 2/1 x 1/3 = 2/3 (should flip the second: 1/2 x 3/1 = 3/2)"
    remediation_target: FRAC.DIV.FRAC
    remediation_asset: "micro-explainers/MISC.FRAC.DIV-WRONG-FLIP.v1"
    parent_summary_i18n:
      en-IN: "{{name}} knows to flip a fraction and multiply when dividing, but sometimes flips the first fraction instead of the second."

  - misconception_id: MISC.NUM.LCM-CONFUSED-WITH-GCF
    belief: "Finds the greatest common factor instead of the lowest common multiple"
    signature_error: "LCM(4, 6) computed as 2 (the GCF) instead of 12"
    remediation_target: NUM.LCM
    remediation_asset: "micro-explainers/MISC.NUM.LCM-CONFUSED-WITH-GCF.v1"
    parent_summary_i18n:
      en-IN: "{{name}} sometimes finds the greatest common factor of two numbers when asked for their lowest common multiple."

  - misconception_id: MISC.FRAC.MIXED-NO-REGROUP
    belief: "Add whole numbers and fraction parts separately, without regrouping an improper fraction result"
    signature_error: "2 3/4 + 1 3/4 = 3 6/4 (should regroup to 4 2/4)"
    remediation_target: FRAC.MIXED.ADD
    remediation_asset: "micro-explainers/MISC.FRAC.MIXED-NO-REGROUP.v1"
    parent_summary_i18n:
      en-IN: "{{name}} adds the whole-number and fraction parts of mixed numbers correctly, but forgets to regroup when the fraction part adds up to more than one whole."
