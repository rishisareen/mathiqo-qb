# Country mapping layer (core design doc §1.4). v1 fixture: the original
# NCERT mapping for FRAC.ADD.UNLIKE per the §1.4 worked example, plus an
# Ontario (Canada) mapping drafted 2026-07-27 via tools/stage1_draft.py
# --mapping-only from examples/ontario-fractions-excerpt.txt — the second
# country the §4 build order calls for, to force the localization/mapping
# discipline early. Both illustrative — grade placements must be verified
# against the actual syllabus documents before authoring begins (core doc,
# note after changelog). Ontario has no single "national" curriculum
# (education in Canada is provincial); it is used here as the illustrative
# province, the same convention as NCERT standing in for "India".
mappings:
  - skill_id: FRAC.ADD.UNLIKE
    country: IN
    curriculum: NCERT
    grade: 6
    depth_expectation: medium   # how far this grade takes the skill; v1 uses tier labels over D (§2.3)
    syllabus_ref: "Class 6, Maths, Ch. 7"
    unit_code: "IN-NCERT-G6-CH7"
    unit_name: "Class 6, Ch. 7"
    learning_objective: >
      Adds and subtracts fractions with unlike denominators
      using equivalent fractions
    exam_contexts: [SCHOOL_EXAM, OLYMPIAD_IMO_L1]
    terminology_overrides:
      "simplest form": "lowest form"     # NCERT phrasing
    pedagogy_notes: >
      NCERT introduces unlike-denominator addition through equivalent
      fractions and the LCM, using paper-folding and fraction-kit visuals
      before the formal procedure.
