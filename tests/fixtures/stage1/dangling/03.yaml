misconceptions:
  - misconception_id: MISC.ZZFIXTURE.MULT-WHOLE-BOTH
    belief: "Multiply top and bottom by the whole number"
    signature_error: "3 x 1/2 = 3/6 = 1/2 (value unchanged)"
    remediation_target: ZZFIXTURE.MULT.WHOLE
    remediation_asset: "micro-explainers/MISC.ZZFIXTURE.MULT-WHOLE-BOTH.v1"
    parent_summary_i18n:
      en-IN: "{{name}} multiplies both the top and bottom of the fraction by the whole number, so the value does not change."
    child_feedback_i18n:
      en-IN: "You multiplied both the top and the bottom by the whole number — that only gives an equivalent fraction with the same value. To multiply a fraction by a whole number, multiply just the numerator (top) by it."
